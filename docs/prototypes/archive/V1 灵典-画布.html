/* 宿主旋钮：模式 / 字体 / 密度 / 动效（带回退，未注入时走默认暗色画布） */
[data-mode=light] .vp{--c-board:#f3f4f6;--c-scr:#fff;--c-line:rgba(24,24,27,.09);--c-tx:#18181b;--c-tx2:rgba(24,24,27,.62);--c-tx3:rgba(24,24,27,.42);--c-lab:#71717a}

<script>(function(){var r=document.documentElement;function s(){try{var c=getComputedStyle(r);var m=c.getPropertyValue("--zwork-preview-mode").trim();if(m&&m!=="auto")r.setAttribute("data-mode",m);var f=c.getPropertyValue("--zwork-preview-font-family").trim();if(/serif|Songti/i.test(f))r.setAttribute("data-fam","serif");else if(/mono|Menlo|SFMono/i.test(f))r.setAttribute("data-fam","mono");}catch(e){}}s();})();</script>
<div class="vp" id="vp"><div class="wd" id="wd"><div class="wrap" id="wrap"></div></div></div>
<script>/* 无限画布渲染：三层结构（01 项目背景 / 02 设计系统 / 03 设计稿）
   屏内一律用产品真实内容与真实 token；画布 chrome 保持中性灰阶。 */
const NM={'claude-code':'Claude Code',cursor:'Cursor','generic-agents':'AGENTS.md',codebuddy:'CodeBuddy',trae:'Trae',minicode:'MiniCode'};
const MONO='ui-monospace,SFMono-Regular,Menlo,monospace';
const B={m:'#2f6f4f',ms:'#e8f1ec',ml:'#cfe3d8'};
const E=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ── 屏卡片外壳 ───────────────────────── */
function screen(name,spec,w,inner,h){
  return `<section class="sc-d" data-sc="${E(name)}" style="width:${w}px">
    <div class="lb"><b>${E(name)}</b><span>${E(spec)}</span></div>
    <div class="frm${h?' fh':''}">${inner}</div>
  </section>`;
}
/* 应用外壳：侧栏 + 顶栏 + 内容 */
function app(active,content,opt){
  opt=opt||{};
  const nav=[['提示词库','资产层'],['术语库',''],['Skill 台账',''],['流程模板',''],['项目工作台','交付层'],['标准包',''],['CLI 终端',''],['设置','系统']];
  let out='<div class="ap">';
  out+='<div class="sd"><div class="bdg"><i>灵</i><b>灵典</b></div>';
  nav.forEach(([n,l])=>{if(l){out+='<div class="nl2">'+l+'</div>';}out+='<div class="nv'+(n===active||(active==='工作台'&&n==='项目工作台')?' on':'')+'">'+n+'</div>';});
  out+='</div><div class="mn2"><div class="tp2"><span class="cb2"><b>'+(active==='工作台'?'项目工作台 / 工作台':active)+'</b></span>'+(opt.search!==false?'<span class="se2">搜索标题 / 正文 / 标签</span>':'')+(opt.btn===null?'':'<span class="bp">'+(opt.btn||'新建')+'</span>')+'</div>';
  out+='<div class="fly"><span>飞轮面板</span><span class="fi2"><i>资产</i><b>135</b></span><span class="fi2"><i>标准包</i><b>1</b></span><span class="fi2"><i>注入</i><b>2</b></span><span class="fi2"><i>回流</i><b class="z2">待产生</b></span><span class="fi2"><i>飞轮圈数</i><b>0</b></span><span class="f3">沉淀资产 → 组标准包 → 注入项目 → 复盘回流</span></div>';
  out+='<div class="ct">'+content+'</div></div></div>';
  return out;
}
const FLY='<span>飞轮面板</span><span class="fi2"><i>资产</i><b>135</b></span><span class="fi2"><i>标准包</i><b>1</b></span><span class="fi2"><i>注入</i><b>2</b></span><span class="fi2"><i>回流</i><b class="z2">待产生</b></span><span class="fi2"><i>飞轮圈数</i><b>0</b></span><span class="f3">沉淀资产 → 组标准包 → 注入项目 → 复盘回流</span>';
const CP=(t,c)=>'<span class="cpx'+(c?' '+c:'')+'">'+t+'</span>';

<script>
/* 画布 chrome：平移 + 屏卡内存态重排（约 1.6KB）；缩放由预览宿主提供 */
(function(){
  const vp=document.getElementById('vp'),wd=document.getElementById('wd');
  let x=0,y=0,pan=null,drag=null;
  const app=()=>wd.style.transform='translate('+x+'px,'+y+'px)';
  document.getElementById('wrap').insertAdjacentHTML('afterbegin','<div class="hdr"><h1>灵典 OpenVibe · 设计总览</h1><p>vibe coding 的标准化工作台 —— 本地优先，数据全在 ~/.openvibe/；Web 管资产与流程，CLI 是写盘的唯一通道。</p><div class="hint2">滚轮缩放 · 拖动屏卡可重排 · 拖空白处平移 · 按 0 复位</div></div>');
  vp.addEventListener('mousedown',e=>{
    if(e.target.closest('.sc-d'))return;
    pan={sx:e.clientX,sy:e.clientY,ox:x,oy:y};vp.classList.add('pan');
  });
  document.addEventListener('mousedown',e=>{
    const el=e.target.closest('.sc-d');if(!el||pan)return;
    if(e.target.closest('input,table,textarea,.cod2,.t2,.tm2'))return;
    const r=el.getBoundingClientRect();
    drag={el,sx:e.clientX,sy:e.clientY,sl:el.offsetLeft,st:el.offsetTop,moved:false};
    el.classList.add('dr');el.style.left=el.offsetLeft+'px';el.style.top=el.offsetTop+'px';
  },true);
  window.addEventListener('mousemove',e=>{
    if(pan){x=pan.ox+e.clientX-pan.sx;y=pan.oy+e.clientY-pan.sy;app();return;}
    if(drag){
      const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
      if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<4)return;
      drag.moved=true;drag.el.style.position='absolute';
      drag.el.style.left=(drag.sl+dx)+'px';drag.el.style.top=(drag.st+dy)+'px';
      drag.el.style.transform='';return;
    }
  });
  window.addEventListener('mouseup',()=>{
    if(pan){pan=null;vp.classList.remove('pan');}
    if(drag){
      const el=drag.el;
      if(drag.moved){
        const c=el.getBoundingClientRect(),cx=c.left+c.width/2;
        const row=el.parentElement,items=[...row.children].filter(n=>n!==el&&n.classList.contains('sc-d'));
        let before=null;
        for(const n of items){const r=n.getBoundingClientRect();if(cx<r.left+r.width/2){before=n;break;}}
        el.style.position='';el.style.left='';el.style.top='';
        row.insertBefore(el,before);
      }else{el.style.position='';el.style.left='';el.style.top='';}
      el.classList.remove('dr');drag=null;
    }
  });
  document.addEventListener('keydown',e=>{if(e.key==='0'){x=0;y=0;app();}});
})();
</script>
