<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenVibe 灵典 · 方案 A · 编辑式账本（可交互原型）</title>
    <style>
      /* ================= 基础 ================= */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --paper: #fbf9f3;
        --paper-2: #f5f1e6;
        --paper-3: #efe9d9;
        --card: #fffdf8;
        --hair: #e8e0cc;
        --line: #d8ceb6;
        --line-2: #b9ad8f;
        --ink: #26241c;
        --ink-2: #45423a;
        --ink-3: #6b6555;
        --ink-4: #6e6857;
        --acc: #34549b;
        --acc-ink: #2c4680;
        --acc-deep: #243a6b;
        --acc-soft: #e8ecf5;
        --acc-line: #c5cee4;
        --on-acc: #fbfaf6;
        --ok: #3d6b45;
        --ok-soft: #e7efe3;
        --warn: #8a6210;
        --warn-soft: #f6edd2;
        --danger: #a63b2a;
        --danger-soft: #f8e8e1;
        --info: #2b5a74;
        --f-serif:
          'Newsreader', Georgia, 'Songti SC', 'Noto Serif CJK SC', 'Source Han Serif SC', 'SimSun',
          serif;
        --f-sans:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', 'Source Han Sans SC', sans-serif;
        --f-mono:
          ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace;
        --ez: cubic-bezier(0.2, 0.7, 0.3, 1);
        --t: 170ms;
      }
      html {
        height: 100%;
      }
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font-family: var(--f-sans);
        font-size: 14px;
        line-height: 1.7;
        color: var(--ink-2);
        background: var(--paper);
        background-image: repeating-linear-gradient(
          0deg,
          transparent 0 26px,
          rgba(38, 36, 28, 0.02) 26px 27px
        );
        -webkit-font-smoothing: antialiased;
      }
      [tabindex='-1']:focus {
        outline: none;
      }
      :focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
        border-radius: 2px;
      }
      ::selection {
        background: var(--acc-soft);
        color: var(--acc-deep);
      }
      button {
        font-family: inherit;
      }
      svg {
        flex: none;
      }
      .mono {
        font-family: var(--f-mono);
        font-variant-numeric: tabular-nums;
      }

      /* ================= 印刷式页眉 ================= */
      .mast {
        flex: none;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 20px;
        height: 58px;
        background: var(--paper);
        border-bottom: 3px double var(--line-2);
        position: relative;
        z-index: 20;
      }
      .seal {
        width: 34px;
        height: 34px;
        background: var(--acc-ink);
        color: var(--on-acc);
        font-family: var(--f-serif);
        font-size: 14px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 3px;
        letter-spacing: 0.08em;
        flex: none;
      }
      .mast-t {
        line-height: 1.3;
        min-width: 0;
      }
      .mast-t b {
        font-family: var(--f-serif);
        font-size: 15.5px;
        font-weight: 600;
        color: var(--ink);
        display: block;
        white-space: nowrap;
      }
      .mast-t span {
        font-size: 11px;
        color: var(--ink-4);
        display: block;
        white-space: nowrap;
      }
      .mast-c {
        flex: 1;
        text-align: center;
        font-size: 12.5px;
        color: var(--ink-3);
        letter-spacing: 0.08em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mast-r {
        display: flex;
        gap: 14px;
        align-items: center;
        font-size: 12px;
        color: var(--ink-3);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .live {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .live .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
        flex: none;
      }
      .burger {
        display: none;
        width: 36px;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink-2);
        cursor: pointer;
        align-items: center;
        justify-content: center;
      }

      /* ================= 三栏骨架 ================= */
      .app {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr) 338px;
      }
      .col {
        overflow-y: auto;
        min-height: 0;
      }
      #ledger {
        background: var(--paper);
        outline: none;
      }

      /* ================= 索引（左） ================= */
      #index {
        background: var(--paper-2);
        border-right: 1px solid var(--hair);
        display: flex;
        flex-direction: column;
      }
      .idx-h {
        padding: 16px 18px 10px;
        border-bottom: 1px solid var(--line-2);
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .idx-h b {
        font-family: var(--f-serif);
        font-size: 16px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: 0.35em;
      }
      .idx-h span {
        font-family: var(--f-mono);
        font-size: 10px;
        color: var(--ink-4);
        letter-spacing: 0.08em;
      }
      .idx-sec {
        padding: 14px 18px 4px;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--ink-4);
      }
      .idx {
        display: flex;
        align-items: baseline;
        gap: 8px;
        width: 100%;
        padding: 7px 18px;
        background: none;
        border: 0;
        font-size: 13.5px;
        color: var(--ink-2);
        cursor: pointer;
        text-align: left;
        transition: background var(--t) var(--ez);
      }
      .idx .no {
        font-family: var(--f-mono);
        font-size: 10.5px;
        color: var(--ink-4);
        width: 20px;
        flex: none;
      }
      .idx .dots {
        flex: 1;
        border-bottom: 1px dotted var(--line-2);
        transform: translateY(-3px);
        min-width: 14px;
      }
      .idx .n {
        font-family: var(--f-mono);
        font-size: 11.5px;
        color: var(--ink-3);
        font-variant-numeric: tabular-nums;
      }
      .idx:hover {
        background: var(--paper-3);
      }
      .idx[aria-current='true'] {
        background: var(--acc-soft);
        color: var(--acc-deep);
        font-weight: 500;
      }
      .idx[aria-current='true'] .no {
        color: var(--acc);
      }
      .idx[aria-current='true'] .dots {
        border-color: var(--acc-line);
      }
      .idx-f {
        margin-top: auto;
        padding: 14px 18px 16px;
        border-top: 1px solid var(--hair);
        font-size: 11.5px;
        color: var(--ink-4);
        line-height: 1.65;
        display: grid;
        gap: 10px;
      }
      .idx-collapse {
        margin-top: auto;
      }
      #app.idxmin {
        grid-template-columns: 0 minmax(0, 1fr) 338px;
      }
      #app.idxmin #index {
        display: none;
      }

      /* ================= 台账主体（中） ================= */
      .vh {
        padding: 24px 28px 16px;
        border-bottom: 1px solid var(--line-2);
        display: flex;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
      }
      .vh .v-no {
        font-family: var(--f-mono);
        font-size: 11.5px;
        color: var(--acc-deep);
        letter-spacing: 0.08em;
        padding-bottom: 6px;
      }
      .vh h1 {
        font-family: var(--f-serif);
        font-size: 25px;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.3;
      }
      .vh .sp {
        flex: 1;
      }
      .vh .v-desc {
        width: 100%;
        font-size: 13px;
        color: var(--ink-3);
        max-width: 72ch;
      }
      .vb {
        padding: 18px 28px 48px;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .panel + .panel {
        margin-top: 16px;
      }
      .p-h {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 13px 16px 11px;
        border-bottom: 1px solid var(--hair);
        flex-wrap: wrap;
      }
      .p-h h2 {
        font-family: var(--f-serif);
        font-size: 16.5px;
        font-weight: 600;
        color: var(--ink);
      }
      .p-h .sub {
        font-size: 12px;
        color: var(--ink-4);
      }
      .p-h .sp {
        flex: 1;
      }
      .p-b {
        padding: 16px;
      }
      .p-b.tight {
        padding: 0;
      }

      /* ================= 表格与脚注 ================= */
      .lt {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      .lt th {
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-4);
        text-align: left;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line-2);
        white-space: nowrap;
        letter-spacing: 0.03em;
      }
      .lt td {
        padding: 9px 12px;
        border-bottom: 1px solid var(--hair);
        vertical-align: top;
      }
      .lt tbody tr {
        transition: background 120ms var(--ez);
      }
      .lt tbody tr:hover {
        background: var(--paper-2);
      }
      .lt .num,
      .lt th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-family: var(--f-mono);
        font-size: 12.5px;
      }
      .lt .code {
        font-family: var(--f-mono);
        font-size: 12px;
        color: var(--acc-deep);
        white-space: nowrap;
      }
      .lt .path {
        font-family: var(--f-mono);
        font-size: 11.5px;
        color: var(--ink-4);
        word-break: break-all;
      }
      tr.rowlink {
        cursor: pointer;
      }
      .tfoot {
        margin-top: 12px;
        padding-top: 9px;
        border-top: 1px solid var(--hair);
        font-size: 12px;
        color: var(--ink-4);
        display: flex;
        flex-wrap: wrap;
        gap: 4px 20px;
        font-variant-numeric: tabular-nums;
      }
      .tfoot .fn::before {
        content: '注 ';
        font-family: var(--f-serif);
      }

      /* ================= 状态三通道 ================= */
      .st {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        white-space: nowrap;
      }
      .st .sd {
        width: 7px;
        height: 7px;
        border-radius: 2px;
        background: currentColor;
        flex: none;
      }
      .st svg {
        width: 13px;
        height: 13px;
      }
      .st-ok {
        color: var(--ok);
      }
      .st-warn {
        color: var(--warn);
      }
      .st-bad {
        color: var(--danger);
      }
      .st-mut {
        color: var(--ink-4);
      }
      .tag {
        display: inline-block;
        padding: 1px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 11px;
        color: var(--ink-3);
        background: var(--paper-2);
        white-space: nowrap;
      }
      .tag-acc {
        border-color: var(--acc-line);
        background: var(--acc-soft);
        color: var(--acc-deep);
      }

      /* ================= 按钮 / chip / 开关 ================= */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 14px;
        border: 1px solid var(--acc-ink);
        background: var(--acc-ink);
        color: var(--on-acc);
        font-size: 13px;
        font-weight: 500;
        border-radius: 6px;
        cursor: pointer;
        transition:
          background var(--t) var(--ez),
          border-color var(--t) var(--ez),
          transform var(--t) var(--ez),
          color var(--t) var(--ez);
      }
      .btn:hover {
        background: var(--acc-deep);
        border-color: var(--acc-deep);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }
      .btn svg {
        width: 14px;
        height: 14px;
      }
      .btn-ghost {
        background: transparent;
        color: var(--acc-ink);
      }
      .btn-ghost:hover {
        background: var(--acc-soft);
      }
      .btn-text {
        border-color: transparent;
        background: transparent;
        color: var(--acc-ink);
        padding: 6px 8px;
      }
      .btn-text:hover {
        background: var(--acc-soft);
      }
      .btn-danger {
        background: var(--danger);
        border-color: var(--danger);
        color: #fffdf8;
      }
      .btn-danger:hover {
        background: #8f3122;
        border-color: #8f3122;
      }
      .btn-sm {
        padding: 4px 10px;
        font-size: 12px;
        border-radius: 5px;
      }
      .ib {
        display: inline-flex;
        width: 26px;
        height: 26px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--card);
        color: var(--ink-3);
        cursor: pointer;
        transition: all var(--t) var(--ez);
      }
      .ib:hover {
        border-color: var(--line-2);
        color: var(--ink);
        background: var(--paper-2);
      }
      .ib:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .ib svg {
        width: 13px;
        height: 13px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--ink-3);
        font-size: 12.5px;
        cursor: pointer;
        transition:
          border-color var(--t) var(--ez),
          background var(--t) var(--ez),
          color var(--t) var(--ez);
      }
      .chip:hover {
        border-color: var(--line-2);
        color: var(--ink);
      }
      .chip[aria-pressed='true'] {
        background: var(--acc-soft);
        border-color: var(--acc-line);
        color: var(--acc-deep);
        font-weight: 500;
      }
      .chip .n {
        font-family: var(--f-mono);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .chiprow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .sw {
        position: relative;
        width: 40px;
        height: 22px;
        border-radius: 999px;
        border: 1px solid var(--line-2);
        background: var(--paper-3);
        cursor: pointer;
        transition:
          background var(--t) var(--ez),
          border-color var(--t) var(--ez);
        flex: none;
      }
      .sw::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--card);
        border: 1px solid var(--line-2);
        transition: transform var(--t) var(--ez);
      }
      .sw[aria-checked='true'] {
        background: var(--acc-ink);
        border-color: var(--acc-ink);
      }
      .sw[aria-checked='true']::after {
        transform: translateX(18px);
        border-color: var(--acc-ink);
      }
      .sw:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ================= 输入 ================= */
      .inp,
      .sel,
      .ta {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--line-2);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        font-size: 13.5px;
        transition:
          border-color var(--t) var(--ez),
          box-shadow var(--t) var(--ez);
      }
      .inp:focus,
      .sel:focus,
      .ta:focus {
        outline: none;
        border-color: var(--acc);
        box-shadow: 0 0 0 3px var(--acc-soft);
      }
      .inp::placeholder,
      .ta::placeholder {
        color: var(--ink-4);
      }
      .inp:disabled,
      .ta:disabled,
      .sel:disabled {
        background: var(--paper-2);
        color: var(--ink-3);
        cursor: not-allowed;
      }
      .ta {
        font-family: var(--f-mono);
        font-size: 12.5px;
        line-height: 1.8;
        resize: vertical;
        min-height: 220px;
      }
      .fld {
        display: grid;
        gap: 6px;
      }
      .fld > label {
        font-size: 12.5px;
        color: var(--ink-3);
      }
      .fld .hint {
        font-size: 11.5px;
        color: var(--ink-4);
      }
      .search {
        position: relative;
        flex: 1;
        min-width: 180px;
        max-width: 340px;
      }
      .search .inp {
        padding-left: 32px;
      }
      .search svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 14px;
        height: 14px;
        color: var(--ink-4);
      }

      /* ================= 文档式阅读页 ================= */
      .doc {
        max-width: 768px;
        margin: 0 auto;
        padding: 30px 6px 56px;
      }
      .d-back {
        margin-bottom: 18px;
      }
      .d-code {
        font-family: var(--f-mono);
        font-size: 12.5px;
        color: var(--acc-deep);
        letter-spacing: 0.05em;
      }
      .doc-h h1 {
        font-family: var(--f-serif);
        font-size: 28px;
        line-height: 1.45;
        color: var(--ink);
        margin: 6px 0 12px;
        font-weight: 600;
      }
      .d-lede {
        font-size: 14px;
        color: var(--ink-3);
        margin-bottom: 16px;
      }
      .d-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 22px;
        font-size: 12.5px;
        color: var(--ink-4);
        padding: 10px 2px;
        border-top: 1px solid var(--line-2);
        border-bottom: 1px solid var(--hair);
        font-variant-numeric: tabular-nums;
      }
      .d-meta b {
        color: var(--ink-3);
        font-weight: 500;
      }
      .d-body {
        font-family: var(--f-serif);
        font-size: 16px;
        line-height: 2.05;
        color: var(--ink-2);
        margin-top: 24px;
      }
      .d-body h3 {
        font-family: var(--f-serif);
        font-size: 17.5px;
        color: var(--ink);
        margin: 28px 0 10px;
        font-weight: 600;
      }
      .d-body p {
        margin: 10px 0;
      }
      .d-body ol,
      .d-body ul {
        padding-left: 1.7em;
        margin: 8px 0;
      }
      .d-body li {
        margin: 5px 0;
      }
      .d-body li::marker {
        color: var(--acc-deep);
        font-size: 0.9em;
      }
      .d-body code {
        font-family: var(--f-mono);
        font-size: 0.8em;
        background: var(--paper-3);
        padding: 2px 6px;
        border-radius: 4px;
        color: var(--ink);
      }
      .d-body strong {
        color: var(--ink);
        font-weight: 600;
      }
      .d-varline {
        margin-top: 22px;
        padding: 12px 14px;
        border: 1px dashed var(--line-2);
        border-radius: 8px;
        background: var(--paper-2);
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        font-size: 12.5px;
        color: var(--ink-3);
      }
      .d-varline code {
        font-family: var(--f-mono);
        font-size: 11.5px;
        color: var(--acc-deep);
      }
      .d-foot {
        margin-top: 36px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
        font-size: 12.5px;
        color: var(--ink-4);
        display: grid;
        gap: 6px;
        line-height: 1.7;
      }
      .d-foot .fn::before {
        content: '注 ';
        font-family: var(--f-serif);
        color: var(--ink-3);
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 7px;
        overflow: hidden;
        background: var(--card);
      }
      .seg button {
        border: 0;
        border-right: 1px solid var(--hair);
        background: transparent;
        padding: 7px 16px;
        font-size: 13px;
        color: var(--ink-3);
        cursor: pointer;
        transition:
          background var(--t) var(--ez),
          color var(--t) var(--ez);
      }
      .seg button:last-child {
        border-right: 0;
      }
      .seg button:hover {
        background: var(--paper-2);
        color: var(--ink);
      }
      .seg button[aria-selected='true'] {
        background: var(--acc-soft);
        color: var(--acc-deep);
        font-weight: 600;
      }

      /* ================= 版本 diff ================= */
      .ver {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
      }
      .ver-h {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--hair);
        flex-wrap: wrap;
      }
      .ver-h .vn {
        font-family: var(--f-mono);
        font-size: 12.5px;
        color: var(--acc-deep);
      }
      .ver-h .vt {
        font-size: 12px;
        color: var(--ink-4);
        font-variant-numeric: tabular-nums;
      }
      .ver-h .sp {
        flex: 1;
      }
      .ver-b {
        padding: 10px 14px;
        font-family: var(--f-mono);
        font-size: 12.5px;
        line-height: 2;
      }
      .dl {
        display: block;
        padding: 0 10px;
        border-radius: 4px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .dl-ctx {
        color: var(--ink-3);
      }
      .dl-add {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .dl-del {
        background: var(--danger-soft);
        color: var(--danger);
        text-decoration: line-through;
        text-decoration-thickness: 1px;
      }
      .dl-add::before {
        content: '+ ';
        font-weight: 600;
      }
      .dl-del::before {
        content: '- ';
        font-weight: 600;
      }

      /* ================= 看板 ================= */
      .kb {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .kb-col {
        background: var(--paper-2);
        border: 1px solid var(--hair);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        min-height: 150px;
      }
      .kb-h {
        padding: 9px 12px;
        border-bottom: 1px solid var(--hair);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12.5px;
        color: var(--ink-3);
      }
      .kb-h b {
        font-weight: 600;
        color: var(--ink);
      }
      .kb-h .cnt {
        font-family: var(--f-mono);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }
      .kb-cards {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }
      .kb-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px 11px;
      }
      .kb-card h4 {
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
        display: flex;
        gap: 8px;
        justify-content: space-between;
        align-items: baseline;
      }
      .kb-meta {
        font-size: 11.5px;
        color: var(--ink-4);
        margin-top: 4px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        font-variant-numeric: tabular-nums;
      }
      .kb-mv {
        display: flex;
        gap: 5px;
        margin-top: 9px;
      }

      /* ================= 阶段条 / 步进条 ================= */
      .stagebar,
      .steps {
        display: flex;
        flex-wrap: wrap;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--card);
      }
      .stage,
      .step {
        flex: 1;
        min-width: 110px;
        padding: 10px 12px;
        background: transparent;
        border: 0;
        border-right: 1px solid var(--hair);
        font-size: 12.5px;
        color: var(--ink-3);
        cursor: pointer;
        text-align: left;
        transition:
          background var(--t) var(--ez),
          color var(--t) var(--ez);
      }
      .stage:last-child,
      .step:last-child {
        border-right: 0;
      }
      .stage .s-no,
      .step .s-n {
        font-family: var(--f-mono);
        font-size: 10.5px;
        color: var(--ink-4);
        display: block;
        margin-bottom: 2px;
      }
      .stage[aria-selected='true'],
      .step[aria-selected='true'] {
        background: var(--acc-soft);
        color: var(--acc-deep);
      }
      .stage[aria-selected='true'] .s-no,
      .step[aria-selected='true'] .s-n {
        color: var(--acc);
      }
      .stage[aria-selected='true'],
      .step[aria-selected='true'] {
        font-weight: 600;
      }
      .stage.done .s-no {
        color: var(--ok);
      }
      .stage:disabled,
      .step:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .chk {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 7px 2px;
        border-bottom: 1px dashed var(--hair);
        font-size: 13.5px;
      }
      .chk:last-child {
        border-bottom: 0;
      }
      .chk input {
        width: 15px;
        height: 15px;
        margin-top: 3px;
        accent-color: var(--acc-ink);
        flex: none;
      }
      .chk .done {
        color: var(--ink-4);
        text-decoration: line-through;
        text-decoration-color: var(--line-2);
      }

      /* ================= 冲突批注 ================= */
      .annot {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        overflow: hidden;
      }
      .annot ol {
        list-style: none;
        counter-reset: ln;
      }
      .annot li {
        display: flex;
        gap: 0;
        padding: 4px 14px 4px 0;
        border-bottom: 1px dashed var(--hair);
        counter-increment: ln;
        font-family: var(--f-mono);
        font-size: 12.5px;
        line-height: 1.9;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .annot li:last-child {
        border-bottom: 0;
      }
      .annot li::before {
        content: counter(ln, decimal-leading-zero);
        width: 46px;
        text-align: right;
        color: var(--ink-4);
        flex: none;
        font-size: 11px;
        padding-top: 2px;
      }
      .annot li.del {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .annot li.add {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .hunk {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 216px;
        gap: 16px;
        align-items: start;
        margin-top: 14px;
      }
      .margin-note {
        font-family: var(--f-serif);
        font-size: 13.5px;
        line-height: 1.8;
        color: var(--danger);
        border-left: 2px solid var(--danger);
        padding: 2px 0 2px 12px;
        margin-top: 6px;
      }
      .margin-note .mn-t {
        display: block;
        font-family: var(--f-mono);
        font-size: 10.5px;
        letter-spacing: 0.1em;
        margin-bottom: 4px;
      }
      .stamp {
        display: flex;
        gap: 12px;
        border: 1.5px solid var(--line);
        border-radius: 8px;
        padding: 13px 15px;
        cursor: pointer;
        background: var(--card);
        transition:
          border-color var(--t) var(--ez),
          background var(--t) var(--ez),
          box-shadow var(--t) var(--ez);
        width: 100%;
        text-align: left;
      }
      .stamp:hover {
        border-color: var(--line-2);
      }
      .stamp[aria-checked='true'] {
        border-color: var(--acc-ink);
        box-shadow: inset 0 0 0 1px var(--acc-ink);
        background: var(--acc-soft);
      }
      .stamp .rd {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1.5px solid var(--line-2);
        margin-top: 3px;
        flex: none;
        position: relative;
      }
      .stamp[aria-checked='true'] .rd {
        border-color: var(--acc-ink);
      }
      .stamp[aria-checked='true'] .rd::after {
        content: '';
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        background: var(--acc-ink);
      }
      .stamp b {
        font-family: var(--f-serif);
        font-size: 15.5px;
        color: var(--ink);
        display: block;
        margin-bottom: 2px;
      }
      .stamp p {
        font-size: 12.5px;
        color: var(--ink-3);
        line-height: 1.7;
      }
      .stamp .def {
        display: inline-block;
        margin-left: 8px;
        font-size: 11px;
        padding: 0 7px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--ink-4);
      }
      .exec {
        border: 1px solid var(--acc-line);
        background: var(--acc-soft);
        border-radius: 8px;
        padding: 14px 16px;
        font-size: 13px;
        color: var(--ink-2);
      }
      .exec b {
        color: var(--acc-deep);
      }
      .exec .mono {
        font-size: 12px;
        color: var(--acc-deep);
        word-break: break-all;
      }

      /* ================= 证据栏（右） ================= */
      #evidence {
        background: var(--paper-2);
        border-left: 1px solid var(--hair);
      }
      .ev-h {
        position: sticky;
        top: 0;
        background: var(--paper-2);
        padding: 14px 18px 11px;
        border-bottom: 1px solid var(--line-2);
        display: flex;
        align-items: baseline;
        gap: 8px;
        z-index: 5;
      }
      .ev-h b {
        font-family: var(--f-serif);
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: 0.14em;
      }
      .ev-h span {
        font-family: var(--f-mono);
        font-size: 10px;
        color: var(--ink-4);
        letter-spacing: 0.08em;
      }
      .ev-b {
        padding: 14px 18px;
        border-bottom: 1px solid var(--hair);
      }
      .ev-b:last-child {
        border-bottom: 0;
      }
      .ev-l {
        font-size: 11px;
        letter-spacing: 0.14em;
        color: var(--ink-4);
        margin-bottom: 8px;
      }
      .ev-code {
        font-family: var(--f-mono);
        font-size: 12.5px;
        color: var(--ink);
        word-break: break-all;
        line-height: 1.85;
      }
      .ev-code em {
        font-style: normal;
        color: var(--acc-deep);
      }
      .ev-kv {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12.5px;
        padding: 3px 0;
      }
      .ev-kv .k {
        color: var(--ink-4);
        flex: none;
      }
      .ev-kv .v {
        color: var(--ink-2);
        text-align: right;
        font-variant-numeric: tabular-nums;
        word-break: break-all;
      }
      .ev-note {
        font-size: 12px;
        color: var(--ink-3);
        line-height: 1.75;
      }
      .ev-acts {
        display: grid;
        gap: 8px;
        margin-top: 4px;
      }
      .ev-b .btn {
        justify-content: center;
      }

      /* ================= 概览飞轮 ================= */
      .fly {
        display: flex;
        align-items: stretch;
        gap: 0;
        flex-wrap: wrap;
      }
      .fly-node {
        flex: 1;
        min-width: 118px;
        border: 1px solid var(--line);
        background: var(--paper-2);
        padding: 10px 12px;
        position: relative;
      }
      .fly-node + .fly-node {
        border-left: 0;
      }
      .fly-node .f-no {
        font-family: var(--f-mono);
        font-size: 10px;
        color: var(--ink-4);
        letter-spacing: 0.08em;
      }
      .fly-node b {
        display: block;
        font-size: 13px;
        color: var(--ink);
        margin: 2px 0 4px;
        font-weight: 600;
      }
      .fly-node .f-n {
        font-family: var(--f-serif);
        font-size: 22px;
        color: var(--acc-deep);
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .fly-node .f-u {
        font-size: 11px;
        color: var(--ink-4);
      }
      .fly-node::after {
        content: '';
        position: absolute;
        right: -7px;
        top: 50%;
        transform: translateY(-50%);
        width: 0;
        height: 0;
        border: 6px solid transparent;
        border-left-color: var(--line-2);
        z-index: 2;
      }
      .fly-node:last-child::after {
        display: none;
      }
      .fly-back {
        margin-top: -1px;
        border: 1px solid var(--line);
        border-top: 0;
        border-radius: 0 0 8px 8px;
        background: var(--card);
        padding: 7px 12px;
        font-size: 12px;
        color: var(--ink-3);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .fly-back svg {
        width: 13px;
        height: 13px;
        color: var(--acc-deep);
      }
      .bignum {
        font-family: var(--f-serif);
        font-size: 44px;
        line-height: 1;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .bignum small {
        font-size: 15px;
        color: var(--ink-4);
        font-family: var(--f-sans);
        margin-left: 6px;
      }

      /* ================= 空态 / 骨架 / 提示条 ================= */
      .empty {
        padding: 40px 20px;
        text-align: center;
        color: var(--ink-3);
      }
      .empty .e-t {
        font-family: var(--f-serif);
        font-size: 16.5px;
        color: var(--ink);
        margin-bottom: 6px;
        font-weight: 600;
      }
      .empty .e-d {
        font-size: 12.5px;
        color: var(--ink-4);
        margin-bottom: 16px;
      }
      .sk {
        position: relative;
        overflow: hidden;
        background: var(--paper-3);
        border-radius: 5px;
        color: transparent !important;
        user-select: none;
      }
      .sk::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 253, 248, 0.7), transparent);
        animation: shim 1.15s infinite;
      }
      @keyframes shim {
        to {
          transform: translateX(100%);
        }
      }
      .notice {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 14px;
        border-radius: 7px;
        font-size: 12.5px;
        line-height: 1.7;
      }
      .notice svg {
        width: 15px;
        height: 15px;
        margin-top: 2px;
      }
      .n-warn {
        background: var(--warn-soft);
        color: var(--warn);
        border: 1px solid #e6cf9d;
      }
      .n-info {
        background: var(--acc-soft);
        color: var(--acc-deep);
        border: 1px solid var(--acc-line);
      }
      .n-ok {
        background: var(--ok-soft);
        color: var(--ok);
        border: 1px solid #c6dcbb;
      }
      .n-bad {
        background: var(--danger-soft);
        color: var(--danger);
        border: 1px solid #eec2b8;
      }
      .notice b {
        font-weight: 600;
      }

      /* ================= 命令块 ================= */
      .cmd {
        display: flex;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line-2);
        background: var(--paper-3);
        border-radius: 7px;
        padding: 10px 12px;
        position: relative;
      }
      .cmd code {
        font-family: var(--f-mono);
        font-size: 12.5px;
        color: var(--ink);
        word-break: break-all;
        flex: 1;
        line-height: 1.8;
      }
      .cmd .prompt-ch {
        color: var(--acc-deep);
        font-family: var(--f-mono);
        font-size: 12.5px;
        flex: none;
      }
      .waitline {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12.5px;
        color: var(--ink-3);
        font-variant-numeric: tabular-nums;
      }
      .waitline .pulse {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--warn);
        animation: pl 1.6s infinite;
      }
      @keyframes pl {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }

      /* ================= 浮层 / 抽屉 / toast ================= */
      #mask {
        position: fixed;
        inset: 0;
        background: rgba(38, 36, 28, 0.44);
        z-index: 80;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 5vh 16px;
      }
      #mask[hidden] {
        display: none;
      }
      .modal {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        max-width: 760px;
        width: 100%;
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 24px 60px rgba(38, 36, 28, 0.3);
        outline: none;
      }
      .modal-h {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 15px 20px 13px;
        border-bottom: 1px solid var(--hair);
        flex-wrap: wrap;
      }
      .modal-h h2 {
        font-family: var(--f-serif);
        font-size: 17px;
        font-weight: 600;
        color: var(--ink);
      }
      .modal-h .sub {
        font-size: 12px;
        color: var(--ink-4);
      }
      .modal-h .sp {
        flex: 1;
      }
      .modal-b {
        padding: 18px 20px;
        overflow-y: auto;
      }
      .modal-f {
        padding: 12px 20px;
        border-top: 1px solid var(--hair);
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }
      #maskD {
        position: fixed;
        inset: 0;
        background: rgba(38, 36, 28, 0.44);
        z-index: 70;
      }
      #maskD[hidden] {
        display: none;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 62px;
        transform: translate(-50%, 14px);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity var(--t) var(--ez),
          transform var(--t) var(--ez);
        z-index: 100;
        background: var(--ink);
        color: var(--paper);
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 13px;
        display: flex;
        gap: 9px;
        align-items: center;
        max-width: min(92vw, 560px);
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #toast svg {
        width: 15px;
        height: 15px;
        color: var(--paper);
      }
      #toast .t-ok {
        color: #a9d2af;
      }
      #toast .t-bad {
        color: #f0b4a8;
      }

      /* ================= 印刷式页脚 ================= */
      .colophon {
        flex: none;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 20px;
        border-top: 3px double var(--line-2);
        background: var(--paper);
        font-size: 11.5px;
        color: var(--ink-4);
        font-variant-numeric: tabular-nums;
      }
      .colophon .mid {
        flex: 1;
        text-align: center;
        font-family: var(--f-serif);
        color: var(--ink-3);
        letter-spacing: 0.1em;
      }
      .colophon .mono-xs {
        font-family: var(--f-mono);
        font-size: 10.5px;
        word-break: break-all;
      }
      .x-only {
        display: none;
      }
      body.expert .x-only {
        display: revert;
      }
      body.expert tr.x-only {
        display: table-row;
      }
      body.expert table .x-only {
        display: table-cell;
      }

      /* ================= 设置两列 ================= */
      .duo {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .duo .panel + .panel {
        margin-top: 0;
      }
      .kvlist {
        display: grid;
      }
      .kvlist .ev-kv {
        padding: 6px 0;
        border-bottom: 1px dashed var(--hair);
      }
      .kvlist .ev-kv:last-child {
        border-bottom: 0;
      }
      .cli-t {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      .cli-t td {
        padding: 6px 10px;
        border-bottom: 1px dashed var(--hair);
        vertical-align: top;
      }
      .cli-t td:first-child {
        font-family: var(--f-mono);
        color: var(--acc-deep);
        white-space: nowrap;
        font-size: 12px;
      }
      .cli-t tr:last-child td {
        border-bottom: 0;
      }

      /* ================= 响应式 ================= */
      @media (max-width: 1279px) {
        .app {
          grid-template-columns: 206px minmax(0, 1fr) 306px;
        }
        .h-evidence {
          display: none;
        }
      }
      @media (max-width: 1023px) {
        body {
          height: auto;
          overflow: auto;
        }
        .app {
          display: block;
        }
        .col {
          overflow: visible;
        }
        #index {
          position: fixed;
          z-index: 75;
          top: 0;
          bottom: 0;
          left: 0;
          width: 282px;
          transform: translateX(-103%);
          transition: transform var(--t) var(--ez);
          box-shadow: 8px 0 32px rgba(38, 36, 28, 0.18);
        }
        body.drawer #index {
          transform: none;
        }
        .burger {
          display: inline-flex;
        }
        .mast-c {
          display: none;
        }
        .h-evidence {
          display: revert;
        }
        #evidence {
          border-left: 0;
          border-top: 3px double var(--line-2);
        }
        .h-evidence {
          display: none !important;
        }
        #ledger {
          display: block;
        }
        #evidence {
          display: block;
        }
        .duo {
          grid-template-columns: 1fr;
        }
        .hunk {
          grid-template-columns: 1fr;
        }
        .margin-note {
          border-left-width: 2px;
        }
      }
      @media (max-width: 767px) {
        .mast {
          padding: 0 12px;
          gap: 10px;
        }
        .mast-t span {
          display: none;
        }
        .mast-r span.hide-s {
          display: none;
        }
        .vh {
