<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenVibe 灵典 · 界面重设计 Demo</title>
    <style>
      /* ============================================================
   OpenVibe 灵典 · 界面重设计 Demo
   设计方向：工程仪表工作台（Instrument Workbench）
   原则：① 状态先于装饰 ② 汉字即图标 ③ 命令优先（⌘K）④ 一屏一主任务
   ============================================================ */
      :root {
        --font-ui:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
          'Segoe UI', sans-serif;
        --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        --rail-w: 66px;
        --topbar-h: 54px;
        --r: 10px;
        --r-sm: 7px;
      }
      :root[data-theme='dark'] {
        --bg: #0d1016;
        --bg-soft: #12161e;
        --panel: #161b24;
        --panel-2: #1b222d;
        --line: #232b37;
        --line-strong: #2e3949;
        --text: #e7edf4;
        --dim: #93a1b2;
        --faint: #5c6b7d;
        --accent: #2fd3b3;
        --accent-ink: #06251d;
        --accent-soft: rgba(47, 211, 179, 0.12);
        --amber: #f4b740;
        --amber-soft: rgba(244, 183, 64, 0.13);
        --red: #ff6f66;
        --red-soft: rgba(255, 111, 102, 0.12);
        --shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
        --input-bg: #10141b;
      }
      :root[data-theme='light'] {
        --bg: #f5f6f8;
        --bg-soft: #eef0f3;
        --panel: #ffffff;
        --panel-2: #f7f8fa;
        --line: #e1e6ec;
        --line-strong: #c9d1dc;
        --text: #161c26;
        --dim: #5c6a7c;
        --faint: #98a4b3;
        --accent: #0d9f82;
        --accent-ink: #ffffff;
        --accent-soft: rgba(13, 159, 130, 0.1);
        --amber: #9a6a0a;
        --amber-soft: rgba(154, 106, 10, 0.1);
        --red: #d6453c;
        --red-soft: rgba(214, 69, 60, 0.1);
        --shadow: 0 14px 40px rgba(20, 30, 50, 0.12);
        --input-bg: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-ui);
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--accent);
        color: var(--accent-ink);
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line-strong);
        border-radius: 6px;
        border: 2px solid var(--bg);
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* ---------- 布局 ---------- */
      #app {
        display: grid;
        grid-template-columns: var(--rail-w) 1fr;
        height: 100vh;
      }
      #main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #view {
        flex: 1;
        overflow-y: auto;
        padding: 22px 26px 60px;
      }

      /* ---------- 书脊导航（汉字即图标） ---------- */
      .rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        border-right: 1px solid var(--line);
        background: var(--bg-soft);
        padding: 14px 0 12px;
        position: relative;
        z-index: 20;
      }
      .wordmark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, var(--accent), #1aa37f);
        color: var(--accent-ink);
        font-weight: 800;
        font-size: 19px;
        letter-spacing: 0.06em;
        margin-bottom: 16px;
        box-shadow: 0 6px 18px var(--accent-soft);
        user-select: none;
      }
      .navitem {
        position: relative;
        width: 46px;
        height: 46px;
        border-radius: 11px;
        margin: 2px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        color: var(--dim);
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
        border: none;
        background: transparent;
        font-family: var(--font-ui);
      }
      .navitem:hover {
        background: var(--panel);
        color: var(--text);
      }
      .navitem.active {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .navitem.active::before {
        content: '';
        position: absolute;
        left: -10px;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 20px;
        border-radius: 2px;
        background: var(--accent);
      }
      .navitem .gz {
        font-size: 19px;
        font-weight: 700;
        line-height: 1.05;
      }
      .navitem .nl {
        font-size: 10px;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .navitem[data-tip]::after {
        content: attr(data-tip);
        position: absolute;
        left: calc(100% + 10px);
        top: 50%;
        transform: translateY(-50%);
        background: var(--panel-2);
        border: 1px solid var(--line-strong);
        color: var(--text);
        padding: 4px 9px;
        border-radius: 7px;
        font-size: 12px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s;
        z-index: 60;
        box-shadow: var(--shadow);
      }
      .navitem[data-tip]:hover::after {
        opacity: 1;
      }
      .rail-foot {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .statusdot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .statuslab {
        font-size: 9px;
        color: var(--faint);
        letter-spacing: 0.08em;
      }

      /* ---------- 顶栏 ---------- */
      .topbar {
        height: var(--topbar-h);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
        position: sticky;
        top: 0;
        z-index: 15;
      }
      .crumbs {
        font-size: 12px;
        color: var(--faint);
      }
      .crumbs b {
        color: var(--text);
        font-weight: 600;
        font-size: 15px;
        margin-right: 2px;
      }
      .crumbs .crumb-sep {
        margin: 0 6px;
        color: var(--line-strong);
      }
      .top-spacer {
        flex: 1;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      /* ---------- 通用控件 ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 13px;
        height: 32px;
        border-radius: var(--r-sm);
        font-size: 13px;
        font-family: var(--font-ui);
        border: 1px solid var(--line-strong);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        transition:
          border-color 0.12s,
          background 0.12s,
          transform 0.05s;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }
      .btn.primary:hover {
        filter: brightness(1.08);
      }
      .btn.danger {
        background: transparent;
        border-color: var(--line-strong);
        color: var(--red);
      }
      .btn.danger:hover {
        border-color: var(--red);
      }
      .btn.sm {
        height: 26px;
        padding: 0 9px;
        font-size: 12px;
        border-radius: 6px;
      }
      .btn.xs {
        height: 22px;
        padding: 0 7px;
        font-size: 11px;
        border-radius: 5px;
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--dim);
      }
      .btn.ghost:hover {
        border-color: var(--line);
        color: var(--text);
        background: var(--panel);
      }
      .btn[disabled] {
        opacity: 0.45;
        pointer-events: none;
      }
      .kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        border: 1px solid var(--line-strong);
        border-bottom-width: 2px;
        border-radius: 5px;
        background: var(--panel);
        color: var(--dim);
        font-family: var(--font-mono);
        font-size: 11px;
      }
      .input,
      .select,
      .textarea {
        width: 100%;
        background: var(--input-bg);
        border: 1px solid var(--line-strong);
        border-radius: var(--r-sm);
        color: var(--text);
        padding: 7px 11px;
        font-size: 13px;
        font-family: var(--font-ui);
        outline: none;
        transition:
          border-color 0.12s,
          box-shadow 0.12s;
      }
      .input:focus,
      .select:focus,
      .textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .input.mono,
      .textarea.mono {
        font-family: var(--font-mono);
        font-size: 12.5px;
      }
      .textarea {
        resize: vertical;
        line-height: 1.7;
      }
      .select {
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--dim) 50%),
          linear-gradient(135deg, var(--dim) 50%, transparent 50%);
        background-position:
          calc(100% - 16px) 55%,
          calc(100% - 11px) 55%;
        background-size: 5px 5px;
        background-repeat: no-repeat;
        padding-right: 30px;
      }
      .label {
        display: block;
        font-size: 12px;
        color: var(--dim);
        margin: 0 0 5px;
      }
      .hint {
        font-size: 12px;
        color: var(--faint);
        line-height: 1.5;
      }
      .mono {
        font-family: var(--font-mono);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 22px;
        padding: 0 9px;
        border-radius: 99px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--dim);
        font-size: 11.5px;
        cursor: pointer;
        transition: all 0.12s;
        white-space: nowrap;
      }
      .chip:hover {
        border-color: var(--line-strong);
        color: var(--text);
      }
      .chip.on {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
      }
      .chip.amber.on {
        border-color: var(--amber);
        background: var(--amber-soft);
        color: var(--amber);
      }
      .chip.red.on {
        border-color: var(--red);
        background: var(--red-soft);
        color: var(--red);
      }
      .chip.solid {
        border-color: transparent;
        background: var(--panel-2);
        color: var(--text);
        cursor: default;
      }
      .chip .x {
        cursor: pointer;
        opacity: 0.6;
      }
      .chip .x:hover {
        opacity: 1;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        height: 20px;
        padding: 0 8px;
        border-radius: 5px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--dim);
        font-size: 11px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        height: 19px;
        padding: 0 7px;
        border-radius: 5px;
        font-size: 11px;
        font-weight: 600;
        font-family: var(--font-mono);
      }
      .badge.accent {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .badge.amber {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .badge.red {
        background: var(--red-soft);
        color: var(--red);
      }
      .badge.plain {
        background: var(--panel-2);
        color: var(--dim);
        border: 1px solid var(--line);
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 6px;
      }
      .dot.accent {
        background: var(--accent);
      }
      .dot.amber {
        background: var(--amber);
      }
      .dot.red {
        background: var(--red);
      }
      .dot.faint {
        background: var(--faint);
      }

      /* ---------- 卡片 ---------- */
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 16px 18px;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .card-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .card-title .sub {
        display: block;
        font-size: 11px;
        font-weight: 400;
        color: var(--faint);
        margin-top: 2px;
      }
      .card-actions {
        margin-left: auto;
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 14px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 14px;
      }
      .muted {
        color: var(--dim);
      }
      .faint {
        color: var(--faint);
      }

      /* ---------- 列表行 ---------- */
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: var(--panel);
        cursor: pointer;
        transition:
          border-color 0.12s,
          background 0.12s;
        margin-bottom: 8px;
      }
      .row:hover {
        border-color: var(--line-strong);
        background: var(--panel-2);
      }
      .row.selected {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .row-main {
        flex: 1;
        min-width: 0;
      }
      .row-title {
        font-weight: 600;
        font-size: 13.5px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .row-desc {
        font-size: 12px;
        color: var(--dim);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      /* ---------- 分段控件 / 步骤条 ---------- */
      .seg {
        display: inline-flex;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 2px;
        gap: 2px;
      }
      .seg button {
        border: none;
        background: transparent;
        color: var(--dim);
        font-size: 12.5px;
        font-family: var(--font-ui);
        padding: 4px 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.12s;
      }
      .seg button.on {
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }
      .steps {
        display: flex;
        gap: 0;
        align-items: center;
        margin: 2px 0 18px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--faint);
        font-size: 12.5px;
      }
      .step .n {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid var(--line-strong);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-mono);
        font-size: 11px;
        background: var(--panel);
      }
      .step.done .n {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
      }
      .step.active {
        color: var(--text);
      }
      .step.active .n {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
      }
      .step-line {
        width: 34px;
        height: 1px;
        background: var(--line-strong);
        margin: 0 8px;
      }

      /* ---------- 抽屉 ---------- */
      .drawer-mask {
        position: fixed;
        inset: 0;
        background: rgba(5, 8, 12, 0.55);
        backdrop-filter: blur(2px);
        z-index: 70;
        animation: fd 0.18s;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(720px, 94vw);
        background: var(--panel);
        border-left: 1px solid var(--line-strong);
        z-index: 71;
        display: flex;
        flex-direction: column;
        animation: fd2 0.22s cubic-bezier(0.2, 0.8, 0.3, 1);
        box-shadow: var(--shadow);
      }
      @keyframes fd {
        from {
          opacity: 0;
        }
      }
      @keyframes fd2 {
        from {
          transform: translateX(26px);
          opacity: 0.6;
        }
      }
      .drawer-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }
      .drawer-title {
        font-size: 15px;
        font-weight: 700;
      }
      .drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 18px;
      }
      .drawer-foot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px;
        border-top: 1px solid var(--line);
      }

      /* ---------- 模态 ---------- */
      .modal-mask {
        position: fixed;
        inset: 0;
        background: rgba(5, 8, 12, 0.55);
        backdrop-filter: blur(2px);
        z-index: 80;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fd 0.18s;
      }
      .modal {
        width: min(560px, 92vw);
        max-height: 86vh;
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        box-shadow: var(--shadow);
        animation: fd2 0.2s;
      }
      .modal-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 15px 18px;
        border-bottom: 1px solid var(--line);
      }
      .modal-title {
        font-size: 15px;
        font-weight: 700;
      }
      .modal-body {
        padding: 18px;
      }
      .modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        padding: 12px 18px;
        border-top: 1px solid var(--line);
      }

      /* ---------- Toast ---------- */
      .toast-wrap {
        position: fixed;
        bottom: 22px;
        right: 22px;
        z-index: 120;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .toast {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 250px;
        max-width: 420px;
        padding: 11px 14px;
        background: var(--panel-2);
        border: 1px solid var(--line-strong);
        border-radius: var(--r-sm);
        box-shadow: var(--shadow);
        font-size: 13px;
        animation: fd2 0.2s;
        cursor: pointer;
      }
      .toast .t-ic {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: var(--accent-ink);
        background: var(--accent);
      }
      .toast.err .t-ic {
        background: var(--red);
      }
      .toast.warn .t-ic {
        background: var(--amber);
      }

      /* ---------- 命令面板 ---------- */
      .palette-mask {
        position: fixed;
        inset: 0;
        background: rgba(5, 8, 12, 0.4);
        z-index: 100;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 14vh;
        animation: fd 0.14s;
      }
      .palette {
        width: min(600px, 92vw);
        background: var(--panel);
        border: 1px solid var(--line-strong);
        border-radius: 13px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .palette-input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 14.5px;
        font-family: var(--font-ui);
        padding: 15px 18px;
        border-bottom: 1px solid var(--line);
      }
      .palette-list {
        max-height: 300px;
        overflow-y: auto;
        padding: 6px;
      }
      .palette-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13.5px;
      }
      .palette-item .pi-ic {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--dim);

          s.checklist.forEach((c) => (md += `- [ ] ${c}\n`))

          md += '\n'

        rules.forEach((r) => {
          md += `#### ${r.title}\n\n${r.content}\n\n`
        })

      function ringSegPath(cx, cy, r0, r1, a0, a1) {
        const p = (a, r) => {
          const x = cx + r * Math.cos((a * Math.PI) / 180),
            y = cy + r * Math.sin((a * Math.PI) / 180)
          return [x, y]
        }
        const [x0, y0] = p(a0, r1),
          [x1, y1] = p(a1, r1),
          [x2, y2] = p(a1, r0),
          [x3, y3] = p(a0, r0)
        const large = a1 - a0 > 180 ? 1 : 0
        return `M${x0.toFixed(1)},${y0.toFixed(1)} A${r1},${r1} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} L${x2.toFixed(1)},${y2.toFixed(1)} A${r0},${r0} 0 ${large} 0 ${x3.toFixed(1)},${y3.toFixed(1)} Z`
      }
      function ringLabels(seg, cx, cy, ang, rMid) {

        return { x, y, anch }

      function diffPanel() {
        const b = STATE.pb
        const vh = b.vh
        if (vh.length < 2) return ''
        const ia = b.vA ?? vh.length - 2,
          ib = b.vB ?? vh.length - 1
        const A = vh[ia].content || '',
          B = vh[ib].content || ''
        const rows = diffLines(A, B).slice(0, 220)
        const cn = { add: 0, del: 0 }
        rows.forEach((r) => {
          if (r.t === 'add') cn.add++
          if (r.t === 'del') cn.del++
        })
        return `<div style="margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span class="hint">对比</span>
    <select class="select" style="width:150px" data-act="pb-diff-a">${vh.map((v, i) => `<option value="${i}" ${i === ia ? 'selected' : ''}>v${v.no} · ${esc(v.note.slice(0, 14))}</option>`).join('')}</select>
    <span class="faint">→</span>
    <select class="select" style="width:150px" data-act="pb-diff-b">${vh.map((v, i) => `<option value="${i}" ${i === ib ? 'selected' : ''}>v${v.no} · ${esc(v.note.slice(0, 14))}</option>`).join('')}</select>
    <span class="badge accent">+${cn.add}</span><span class="badge red">−${cn.del}</span>
  </div>
  <div class="diff" style="margin-top:8px;max-height:300px;overflow-y:auto">
    ${rows.map((r) => `<div class="diff-row ${r.t === 'add' ? 'diff-add' : r.t === 'del' ? 'diff-del' : 'diff-ctx'}"><span class="diff-ln"></span><span>${esc(r.s) || '&nbsp;'}</span></div>`).join('')}
  </div>`
      }

        STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark'
        document.documentElement.dataset.theme = STATE.theme
        try {
          localStorage.setItem('openvibe.theme', STATE.theme)
        } catch (e) {}
        renderAll()
      }
      ACTS['open-palette'] = () => {
        STATE.paletteOpen = true
        STATE.paletteQuery = ''

        renderPalette()
      }
      ACTS['design-notes'] = () => {
        STATE.modal = { kind: 'design' }
        renderModal()
      }

        const map = {
          assets: 'library',
          packs: 'packs',
          inject: 'packs',
          active: 'projects',
          reflow: 'terms',
        }
        routeTo(map[el.dataset.k] || 'overview')

        else if (q === 'terms') routeTo('terms')

      }

        renderToasts()

        STATE.libTag = el.dataset.tag || ''
        renderAll()
      }

          arg: 'import',

        renderDrawer()
      }
      ACTS['pb-tag-x'] = (el) => {
        STATE.pb.tags.splice(+el.dataset.i, 1)
        renderDrawer()
      }

        b.activeTab = 'edit'
        renderDrawer()
        toast(`已载入 v${v.no}，保存时生成新版本`)
      }

        renderDrawer()

        renderDrawer()

        renderModal()

        const filled = b.content.replace(
          /\{\{\s*([^{}]+?)\s*\}\}/g,
          (_, v) => vals[v.trim()] ?? `{{${v.trim()}}}`,
        )

          desc: '',
          flowId: 'fl_01',
          promptIds: ['prm_01', 'prm_03'],
          termMode: 'all',
          targets: ['claude-code', 'generic-agents'],
        }
        STATE.modal = { kind: 'pack-wizard' }
        renderModal()
      }
      function moveTask(id, status) {
        const p = curProject()
        if (!p) return
        const t = p.tasks.find((x) => x.id === id)
        if (t && t.status !== status) {
          t.status = status
          $('#view').innerHTML = renderProjectDetail()
        }
      }

      /* 命令面板 */
      function paletteItems() {
        return [
          ...NAV.map((n) => ({ ic: n.gz, label: TITLES[n.k][0], path: '/' + n.k, nav: n.k })),
          { ic: '✎', label: '新建提示词', path: '提示词库', act: 'prompt-new' },
          { ic: '▤', label: '组装标准包', path: '标准包', act: 'pack-new' },
          { ic: '▣', label: '新建项目', path: '项目', act: 'proj-new' },
          { ic: '⌗', label: '复制 sync 命令', path: '总览', act: 'sync-copy' },
          { ic: '☀', label: '切换主题', path: '设置', act: 'theme-toggle' },
          { ic: '◈', label: '设计说明', path: '设置', act: 'design-notes' },
        ]
      }
      function renderPalette() {
        const m = $('#ov-palette')
        if (!m) return
        if (!STATE.paletteOpen) {
          m.innerHTML = ''
          return
        }
        const q = (STATE.paletteQuery || '').toLowerCase()
        const list = paletteItems().filter(
          (it) => !q || (it.label + ' ' + it.path + ' ' + (it.nav || '')).toLowerCase().includes(q),
        )
        STATE.paletteItems = list
        if (STATE.paletteSel >= list.length) STATE.paletteSel = 0
        m.innerHTML = `<div class="palette-mask" data-act="palette-close-mask"><div class="palette">
    <input class="palette-input" placeholder="搜索页面或动作…（新建 / 组包 / 注入 / 主题…）" value="${esc(STATE.paletteQuery)}" data-act="palette-input">
    <div class="palette-list">${
      list.length
        ? list
            .map(
              (it, i) => `
      <div class="palette-item ${i === STATE.paletteSel ? 'sel' : ''}" data-act="palette-item" data-i="${i}">
        <span class="pi-ic">${it.ic}</span><span>${esc(it.label)}</span><span class="pi-path">${it.path}</span>
      </div>`,
            )
            .join('')
        : '<div class="empty"><div class="e-ic">⌕</div>没有匹配项</div>'
    }</div>
    <div class="palette-foot"><span>↑↓ 选择 · ↵ 执行</span><span>esc 关闭</span><span style="margin-left:auto">OpenVibe 命令面板</span></div>
  </div></div>`
        const inp = $('#ov-palette .palette-input')
        if (inp) inp.focus()
      }
      function execPaletteItem(it) {
        if (!it) return
        STATE.paletteOpen = false
        renderPalette()
        if (it.nav) routeTo(it.nav)
        else if (it.act === 'sync-copy') copySyncCmd()
        else if (ACTS[it.act]) ACTS[it.act]({ dataset: {} })
      }

      /* 键盘 */
      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault()
          STATE.paletteOpen = !STATE.paletteOpen
          if (STATE.paletteOpen) {
            STATE.paletteQuery = ''
            STATE.paletteSel = 0
          }
          renderPalette()
          return
        }
        if (STATE.paletteOpen) {
          if (e.key === 'Escape') {
            STATE.paletteOpen = false
            renderPalette()
            return
          }
          const list = STATE.paletteItems || []
          if (e.key === 'ArrowDown') {
            e.preventDefault()
            STATE.paletteSel = (STATE.paletteSel + 1) % Math.max(1, list.length)
            renderPalette()
            return
          }
          if (e.key === 'ArrowUp') {
            e.preventDefault()
            STATE.paletteSel =
              (STATE.paletteSel - 1 + Math.max(1, list.length)) % Math.max(1, list.length)
            renderPalette()
            return
          }
          if (e.key === 'Enter') {
            e.preventDefault()
            execPaletteItem(list[STATE.paletteSel])
            return
          }
          return
        }
        if (e.key === 'Escape') {
          if (STATE.modal) {
            STATE.modal = null
            renderModal()
            return
          }
          if (STATE.drawer) {
            STATE.drawer = null
            renderDrawer()
            return
          }
        }
        const t = e.target
        if (t && t.dataset && t.dataset.act === 'pb-tag-add' && e.key === 'Enter') {
          e.preventDefault()
          const v = t.value.trim()
          if (v && !STATE.pb.tags.includes(v)) {
            STATE.pb.tags.push(v)
          }
          t.value = ''
          renderDrawer()
        }
      })
      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-act]')
        if (!el) return
        const act = el.dataset.act
        if (ACTS[act]) ACTS[act](el, e)
      })
      document.addEventListener('input', (e) => {
        const el = e.target,
          act = el.dataset && el.dataset.act
        if (act && INPUTS[act]) INPUTS[act](el, e)
      })
      document.addEventListener('change', (e) => {
        const el = e.target,
          act = el.dataset && el.dataset.act
        if (act && ACTS[act]) ACTS[act](el, e)
      })
      /* 看板 HTML5 拖拽 */
      document.addEventListener('dragstart', (e) => {
        const c = e.target.closest('[data-task]')
        if (c) {
          STATE.dragTask = c.dataset.task
          c.classList.add('dragging')
          e.dataTransfer.effectAllowed = 'move'
        }
      })
      document.addEventListener('dragover', (e) => {
        const col = e.target.closest('.kcol')
        if (col) {
          e.preventDefault()
          col.classList.add('drag-over')
        }
      })
      document.addEventListener('dragleave', (e) => {
        const col = e.target.closest('.kcol')
        if (col) col.classList.remove('drag-over')
      })
      document.addEventListener('drop', (e) => {
        const col = e.target.closest('.kcol')
        if (col && STATE.dragTask) {
          e.preventDefault()
          moveTask(STATE.dragTask, col.dataset.col)
        }
        if (col) col.classList.remove('drag-over')
      })
      document.addEventListener('dragend', () => {
        $$('.kcard.dragging').forEach((c) => c.classList.remove('dragging'))
        STATE.dragTask = null
      })

      /* =====================================================================
   初始化
   ===================================================================== */
      function seedVh(p) {
        const lines = p.content.split('\n')
        const arr = []
        for (let v = 1; v <= p.version; v++) {
          const cut = p.version - v
          const content =
            cut > 0
              ? lines.slice(0, Math.max(1, lines.length - cut)).join('\n') + '\n…（后文同当前版本）'
              : p.content
          arr.push({
            no: v,
            at: isoDaysAgo((p.version - v) * 1.3 + 2),
            note: v === p.version ? '当前版本（最近一次保存）' : `修订 v${v}`,
            content,
          })
        }
        return arr
      }
      function isoDaysAgo(d) {
        const t = new Date(Date.now() - d * 86400e3)
        return t.toISOString().slice(0, 19).replace('T', ' ')
      }
      function init() {
        initOverlays()
        try {
          const t = localStorage.getItem('openvibe.theme')
          if (t === 'light' || t === 'dark') STATE.theme = t
          document.documentElement.dataset.theme = STATE.theme
        } catch (e) {}
        const st = document.createElement('style')
        st.textContent = '.amber{color:var(--amber)}'
        document.head.appendChild(st)
        STATE.prompts.forEach((p) => {
          p.vh = seedVh(p)
        })
        STATE.terms.push({
          zh: '注入指纹',
          en: 'injection fingerprint',
          ali: ['指纹'],
          def: '标准包导出时对全部产物计算的内容摘要（sha256），写入 pack.lock.json 后用于漂移检测；指纹一致 = 标准仍在生效。',
          rel: ['注入', '标准包'],
          src: 'user',
        })
        STATE.projects.forEach((p, pi) => {
          p.logs.forEach((l, li) => {
            l.at = l.at || isoDaysAgo(pi * 2 + li + 1)
          })
        })
        STATE.projects.forEach((p) => {
          p.checkState = p.checkState || {}
          const fl = STATE.flows.find((f) => f.id === p.flowId)
          if (fl && p.checks) {
            fl.stages.forEach((s) => {
              const n = p.checks[s.name] || 0
              const arr = (p.checkState[s.name] = [])
              for (let i = 0; i < s.checklist.length; i++) arr[i] = i < n
            })
          }
        })
        STATE.termSelIds = STATE.terms.slice(0, 5).map((_, i) => i)
        STATE.telemetry = false
        STATE.loops = computeLoops()
        const h = (location.hash || '').replace('#/', '').split('/')[0]
        if (NAV.some((n) => n.k === h)) STATE.route = h
        renderAll()
      }
      init()
    </script>
  </body>
</html>
