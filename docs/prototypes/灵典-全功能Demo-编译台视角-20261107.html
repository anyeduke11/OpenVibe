<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenVibe 灵典 · 全功能交互 Demo A · 编译台视角</title>
<style>
/* ══════════════════════════════════════════════════════════════════
   OpenVibe · 灵典 ——「暖纸 · 可读性工作台 V2」
   设计口径唯一出处：DESIGN.md；token 值取自 apps/web/src/index.css（29 支 × 双主题）。
   本文件为交互演示：单文件、零外部依赖、断网双击即开；全部数据为演示样例。
   ══════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --canvas:#faf5ec; --panel:#fffdf9; --panel-2:#f8f1e6; --panel-sunk:#f1e7d8;
  --line-hair:#efe5d5; --line:#e3d6c1; --line-strong:#cdbca2;
  --ink:#2a2018; --ink-body:#4a3b2d; --ink-muted:#6a5846; --ink-faint:#75634c;
  --accent:#a8501c; --accent-deep:#7c3811; --accent-soft:#f7e8d7; --accent-line:#e4c9ab; --on-accent:#fffaf3;
  --ok:#3d6b37; --ok-soft:#ecf2e3; --ok-line:#c6dcbb;
  --warn:#92610e; --warn-soft:#f9efd7; --warn-line:#e6cf9d;
  --danger:#ab3527; --danger-soft:#fbe7e2; --danger-line:#eec2b8;
  --info:#2b5a74; --info-soft:#e4edf2; --info-line:#bdd3df;
  --scrim:#2a2018;
  --sh1:0 1px 2px color-mix(in srgb,var(--scrim) 5%,transparent),0 1px 1px color-mix(in srgb,var(--scrim) 4%,transparent);
  --sh2:0 4px 16px -4px color-mix(in srgb,var(--scrim) 12%,transparent),0 2px 4px color-mix(in srgb,var(--scrim) 5%,transparent);
  --sh3:0 24px 48px -16px color-mix(in srgb,var(--scrim) 26%,transparent),0 8px 16px -8px color-mix(in srgb,var(--scrim) 12%,transparent);
  --font:'Outfit','PingFang SC','Hiragino Sans GB','HarmonyOS Sans SC','MiSans','Microsoft YaHei',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --ease:cubic-bezier(.2,.7,.3,1); --dur:160ms;
}
[data-theme='dark']{
  color-scheme:dark;
  --canvas:#16120f; --panel:#1e1a14; --panel-2:#26201a; --panel-sunk:#2d2820;
  --line-hair:#28251f; --line:#3a362c; --line-strong:#4a4538;
  --ink:#f0ebe0; --ink-body:#c8c2b4; --ink-muted:#a39e8e; --ink-faint:#9a8b76;
  --accent:#e9a63f; --accent-deep:#c4822e; --accent-soft:#372814; --accent-line:#4a3320; --on-accent:#1b1510;
  --ok:#74b290; --ok-soft:#1f2e25; --ok-line:#2a4234;
  --warn:#c89c3f; --warn-soft:#2f2817; --warn-line:#57451b;
  --danger:#e8836f; --danger-soft:#33221d; --danger-line:#5a2f27;
  --info:#6f9cc5; --info-soft:#1c2a38; --info-line:#24384a;
  --scrim:#080503;
}
*{box-sizing:border-box}
html,body{height:100%}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--canvas);color:var(--ink-body);font-family:var(--font);font-size:15px;line-height:1.72;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--accent-soft);color:var(--ink)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:7px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:15px;height:15px;padding:0;flex:none}
input:disabled{opacity:.45;cursor:not-allowed}
svg{display:block;flex:none}

/* ---------- 布局 ---------- */
#app{display:flex;flex-direction:column;height:100vh}
#topbar{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
#brand{display:flex;align-items:center;gap:10px;min-width:0}
.tile{width:30px;height:30px;border-radius:8px;background:linear-gradient(160deg,var(--accent),var(--accent-deep));color:var(--on-accent);display:grid;place-items:center;font-weight:600;font-size:14px}
#brand b{color:var(--ink);font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;display:block;line-height:1.3}
#brand span{font-size:11.5px;color:var(--ink-muted);white-space:nowrap;display:block;line-height:1.3}
#topbar .spacer{flex:1}
#demobar{flex:none;background:var(--panel-2);border-bottom:1px solid var(--line-hair);color:var(--ink-muted);font-size:12px;padding:4px 18px;display:flex;gap:14px;align-items:center}
#demobar .dot{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none}
#frame{flex:1;display:flex;min-height:0}
#side{width:216px;flex:none;background:var(--canvas);border-right:1px solid var(--line);padding:12px 10px 24px;overflow-y:auto}
#side .grp{font-size:11px;color:var(--ink-faint);padding:12px 10px 4px}
#side .grp:first-child{padding-top:2px}
.nav{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:8px;color:var(--ink-muted);font-size:13.5px;position:relative;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.nav:hover{background:var(--panel-2);color:var(--ink)}
.nav[aria-current=true]{background:var(--accent-soft);color:var(--accent-deep);font-weight:500}
.nav[aria-current=true]::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--accent)}
.nav .cnt{margin-left:auto;font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.nav[aria-current=true] .cnt{color:var(--accent-deep)}
#view{flex:1;min-width:0;overflow-y:auto;padding:26px 30px 80px}
.vh h1{margin:0;font-size:25px;font-weight:600;letter-spacing:-.02em;color:var(--ink);line-height:1.25}
.vh p{margin:4px 0 0;color:var(--ink-muted);font-size:13.5px;max-width:68ch}
.vh .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sect{margin-top:22px}
.sect>h2{margin:0 0 10px;font-size:16px;font-weight:600;color:var(--ink)}

/* ---------- 组件 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh1)}
.card .hd{padding:11px 14px;border-bottom:1px solid var(--line-hair);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .hd h3{margin:0;font-size:13.5px;font-weight:600;color:var(--ink)}
.card .hd .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .bd{padding:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink-body);border-radius:var(--r-sm);padding:6px 12px;font-size:13px;transition:all var(--dur) var(--ease)}
.btn:hover{background:var(--panel-2);border-color:var(--ink-faint)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:var(--sh1)}
.btn.pri:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-muted)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn.danger{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger)}
.btn.danger:hover{background:var(--danger);border-color:var(--danger);color:var(--panel)}
.btn.sm{padding:3px 8px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font-size:11px;line-height:1.7;padding:1px 9px;background:var(--panel-sunk);border:1px solid var(--line);color:var(--ink-muted);white-space:nowrap}
.chip.c-ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.chip.c-warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.chip.c-danger{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger)}
.chip.c-info{background:var(--info-soft);border-color:var(--info-line);color:var(--info)}
.chip.c-accent{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-deep)}
[data-theme='dark'] .chip.c-accent{color:var(--accent)}
.tag{display:inline-block;border-radius:6px;font-size:11.5px;line-height:1.7;padding:0 7px;background:var(--panel-2);border:1px solid var(--line-hair);color:var(--ink-muted);white-space:nowrap}
.tag.mono{font-family:var(--mono)}
.note{border:1px solid;border-radius:var(--r-md);padding:10px 14px;font-size:13px}
.note b{display:block;font-size:13px;margin-bottom:2px}
.note.n-ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ink-body)}
.note.n-ok b{color:var(--ok)}
.note.n-warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--ink-body)}
.note.n-warn b{color:var(--warn)}
.note.n-danger{background:var(--danger-soft);border-color:var(--danger-line);color:var(--ink-body)}
.note.n-danger b{color:var(--danger)}
.note.n-info{background:var(--info-soft);border-color:var(--info-line);color:var(--ink-body)}
.note.n-info b{color:var(--info)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11.5px;font-weight:500;color:var(--ink-faint);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-hair);vertical-align:top}
.tbl tr:hover td{background:var(--panel-2)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .mono{font-size:12px;word-break:break-all}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--sh1)}
.stat .k{font-size:12px;color:var(--ink-faint)}
.stat .v{font-size:27px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.3}
.stat .m{font-size:12px;color:var(--ink-muted)}
.rows{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--panel)}
.rows .row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-hair);min-width:0;flex-wrap:wrap}
.rows .row:last-child{border-bottom:none}
.rows .row:hover{background:var(--panel-2)}
.rows .row[aria-selected=true]{background:var(--accent-soft)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border-radius:5px;padding:4px 12px;font-size:12.5px;color:var(--ink-muted)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:var(--sh1);font-weight:500}
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--r-md);padding:26px;text-align:center;color:var(--ink-faint);font-size:13px}
.empty .btn{margin-top:10px}
.skel{background:var(--panel-2);border-radius:6px;height:12px;animation:pulse 1.1s var(--ease) infinite}
.skel.w60{width:60%}.skel.w80{width:80%}.skel.w40{width:40%}
@keyframes pulse{50%{opacity:.55}}
pre.code{background:var(--panel-sunk);border:1px solid var(--line-hair);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.7;overflow:auto;color:var(--ink-body);margin:0;white-space:pre-wrap;word-break:break-word}
.cmd{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-sunk);font-family:var(--mono);font-size:12px;color:var(--ink-body)}
.cmd code{flex:1;min-width:0;word-break:break-all}
.cmd .btn{flex:none}

/* ---------- 浮层 ---------- */
#overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--scrim) 40%,transparent);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
#overlay[hidden]{display:none}
#toast[hidden]{display:none}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh3);width:min(880px,100%);max-height:min(84vh,900px);display:flex;flex-direction:column}
#panel .ph{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-hair)}
#panel .ph h3{margin:0;font-size:15px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#panel .pb{padding:16px 18px;overflow-y:auto}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--canvas);border-radius:999px;padding:8px 18px;font-size:13px;z-index:60;box-shadow:var(--sh2);max-width:min(92vw,640px)}

/* ---------- 视图专属 ---------- */
#lib-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:14px;align-items:start}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fchip{border:1px solid var(--line);background:var(--panel-sunk);border-radius:999px;padding:2px 11px;font-size:12px;color:var(--ink-muted)}
.fchip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-deep)}
.stagebar{display:flex;gap:6px;flex-wrap:wrap}
.stagebar button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 13px;font-size:12.5px;color:var(--ink-muted)}
.stagebar button.done{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok)}
.stagebar button.cur{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep);font-weight:500;box-shadow:var(--sh1)}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcol{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);padding:10px}
.kcol h4{margin:2px 4px 10px;font-size:12.5px;color:var(--ink-muted);display:flex;gap:8px;align-items:center}
.kcol h4 .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-faint)}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;margin-bottom:8px;box-shadow:var(--sh1);display:flex;gap:8px;align-items:flex-start}
.kcard .t{flex:1;min-width:0;font-size:13px;color:var(--ink)}
.kcard .mv{display:flex;gap:3px}
.kcard .mv .btn{padding:1px 6px;font-size:11px}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pstep .arrow{display:none}
@media (min-width:1024px){.pstep{position:relative}.pstep .arrow{display:block;position:absolute;right:-14px;top:50%;transform:translateY(-50%);color:var(--ink-faint);z-index:2}}
.md{font-size:14px;line-height:1.72;color:var(--ink);max-width:68ch}
.md p{margin:6px 0}
.diff{font-family:var(--mono);font-size:12px;line-height:1.7;border:1px solid var(--line-hair);border-radius:var(--r-sm);overflow:hidden}
.diff div{padding:1px 10px;white-space:pre-wrap;word-break:break-word}
.diff .add{background:var(--ok-soft);color:var(--ok)}
.diff .del{background:var(--danger-soft);color:var(--danger)}
.diff .ctx{color:var(--ink-muted)}
.tabbar{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;gap:2px;flex-wrap:wrap;max-width:100%}
.tabbar button{border-radius:5px;padding:4px 12px;font-size:12.5px;color:var(--ink-muted)}
.tabbar button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:var(--sh1);font-weight:500}
.capbit{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.capbit.t{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.capbit.f{background:var(--panel-sunk);color:var(--ink-muted)}
.capbit.u{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.flyring{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{width:148px;height:148px;flex:none}
.ring .lbl{font-size:11px;fill:var(--ink-muted)}
.ring .big{font-size:30px;font-weight:600;fill:var(--ink);font-variant-numeric:tabular-nums}
.pro{display:none}
body.expert .pro{display:revert}
.why{font-size:12.5px;color:var(--ink-faint);display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.why:hover{color:var(--accent)}
.spark{display:flex;align-items:flex-end;gap:6px;height:56px;padding-bottom:20px}
.spark i{width:26px;background:var(--accent);opacity:.85;border-radius:3px 3px 0 0;position:relative;height:calc(var(--h)*1%)}
.spark i span{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.spark i.alt{background:var(--info)}

/* ---------- 响应式 ---------- */
@media (max-width:1023px){
  #frame{flex-direction:column}
  #side{width:100%;display:flex;flex-wrap:wrap;gap:2px;padding:8px 12px;border-right:none;border-bottom:1px solid var(--line)}
  #side .grp{display:none}
  .nav{width:auto;padding:5px 10px}
  .nav .cnt{display:none}
  #lib-layout{grid-template-columns:1fr}
  .g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:767px){
  #view{padding:18px 16px 80px}
  .g2,.g3,.g4,.g5,.kan,.pipe{grid-template-columns:1fr}
  .vh h1{font-size:21px}
  .hide-sm{display:none}
  #brand span{display:none}
  #demobar .mono{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="brand">
      <div class="tile">灵</div>
      <div>
        <b>OpenVibe 灵典</b>
        <span>全功能交互 Demo A · 编译台视角</span>
      </div>
    </div>
    <span class="chip c-info" title="口径：docs/PRD-v0.2.5-v0.9-20261029.md · 2026-11-07 裁定 D-v25">v0.2.5 · v0.9 口径</span>
    <div class="spacer"></div>
    <button class="btn sm" data-act="map" title="全功能与需求覆盖地图（三份 Demo 共用同一数据）"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 3.5l4.5-1.5v11L1.5 14.5zM6 2l4.5 1.5v11L6 13zM10.5 3.5l4-1.2v11l-4 1.2"/></svg>覆盖地图</button>
    <button class="btn sm" data-act="expert" id="btn-expert" aria-pressed="false" title="一键越级：显示全部高级块（渐进披露红线 4）"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.8v3.6l2.2 1.6"/></svg>专家视图</button>

function ratio(a,b){var l1=lum(a),l2=lum(b);var hi=Math.max(l1,l2),lo=Math.min(l1,l2);return (hi+0.05)/(lo+0.05)}

 var tb=$('#contrast-tbl tbody');if(!tb)return;
 var cs=getComputedStyle(document.documentElement);
 function v(n){return cs.getPropertyValue(n).trim()}
 var pairs=[['ink','panel','浓墨 on 纸面'],['ink-body','panel-2','正文 on 次级容器'],['ink-muted','panel-2','次要 on 次级容器'],['ink-faint','panel-sunk','元信息 on 下沉容器'],['accent','canvas','强调 on 画布'],['on-accent','accent','实心按钮字']];
 var h='';
 pairs.forEach(function(p){
  var r=ratio(v('--'+p[0]),v('--'+p[1]));
  var g=r>=7?'AAA':r>=4.5?'AA':'&lt;AA';
  h+='<tr><td class="mono" style="font-size:11.5px">--'+p[0]+'</td><td class="mono hide-sm" style="font-size:11.5px">--'+p[1]+'</td><td><span class="num">'+r.toFixed(2)+'</span> : 1</td><td>'+(r>=4.5?'<span class="chip c-ok">'+I.ok+g+'</span>':'<span class="chip c-danger">'+I.err+g+'</span>')+'</td></tr>';
 });
 tb.innerHTML=h;
 var th=$('#contrast-theme');if(th)th.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'暖夜':'暖纸';
}

function kanMove(id,dir){
 var cols=['todo','doing','done'];
 var from=-1,fi=-1,title='';
 for(var i=0;i<cols.length;i++){
  for(var j=0;j<TASKS[cols[i]].length;j++){
   if(TASKS[cols[i]][j][0]===id){from=i;fi=j;title=TASKS[cols[i]][j][1];break}
  }
  if(from>=0)break;
 }
 if(from<0)return;
 var to=Math.max(0,Math.min(2,from+dir));
 if(to===from){toast('已是最'+(from===0?'左':from===2?'右':'侧')+'列');return}
 TASKS[cols[from]].splice(fi,1);
 TASKS[cols[to]].push([id,title]);
 renderProjects();
 toast('「'+id+'」已移到'+(to===0?'待办':to===1?'进行中':'已完成')+'（按钮与拖拽 / 键盘同效）');
}
function gateRun(){
 var curChecks=CHECKS[STAGE_I];

 if(un){toast('拒绝推进：清单未完成 '+un+' 项（可判前置，非法推进 409）');return}
 if(STAGE_I>=6){toast('已是最后阶段');return}
 STAGE_I++;renderProjects();toast('已推进到「'+STAGES[STAGE_I]+'」（演示）');
}
