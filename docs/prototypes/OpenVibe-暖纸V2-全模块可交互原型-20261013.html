<!doctype html>
<html lang="zh-CN" data-theme="paper">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenVibe 灵典 · 暖纸 V2 工作台原型</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=JetBrains+Mono:wght@400..800&display=swap"
    />
    <style>
      /* ═══════════════════════════════════════════════════════════════════════════
   OpenVibe · 灵典 ——「暖纸 · 可读性工作台 V2」
   颜色单源即本文件的 :root / [data-theme='dark'] 两块；调用点只写语义类。
   口径出处：DESIGN.md（29 支颜色 token · 双主题同构）。暖夜取自
   docs/prototypes/暖系-暖纸V2-可读性交互Demo-20260929.html，属性值统一叫 dark。
   ═══════════════════════════════════════════════════════════════════════════ */
      :root {
        --canvas: #faf5ec;
        --panel: #fffdf9;
        --panel-2: #f8f1e6;
        --panel-sunk: #f1e7d8;
        --line-hair: #efe5d5;
        --line: #e3d6c1;
        --line-strong: #cdbca2;
        --ink: #2a2018;
        --ink-body: #4a3b2d;
        --ink-muted: #6a5846;
        --ink-faint: #75634c;
        --accent: #a8501c;
        --accent-deep: #7c3811;
        --accent-soft: #f7e8d7;
        --accent-line: #e4c9ab;
        --on-accent: #fffaf3;
        --ok: #3d6b37;
        --ok-soft: #ecf2e3;
        --ok-line: #c6dcbb;
        --warn: #92610e;
        --warn-soft: #f9efd7;
        --warn-line: #e6cf9d;
        --danger: #ab3527;
        --danger-soft: #fbe7e2;
        --danger-line: #eec2b8;
        --info: #2b5a74;
        --info-soft: #e4edf2;
        --info-line: #bdd3df;
        --scrim: #2a2018;
        --shadow-1:
          0 1px 2px color-mix(in srgb, var(--scrim) 5%, transparent),
          0 1px 1px color-mix(in srgb, var(--scrim) 4%, transparent);
        --shadow-2:
          0 4px 16px -4px color-mix(in srgb, var(--scrim) 12%, transparent),
          0 2px 4px color-mix(in srgb, var(--scrim) 5%, transparent);
        --shadow-3:
          0 24px 48px -16px color-mix(in srgb, var(--scrim) 26%, transparent),
          0 8px 16px -8px color-mix(in srgb, var(--scrim) 12%, transparent);
        --font:
          'Outfit', 'PingFang SC', 'Hiragino Sans GB', 'HarmonyOS Sans SC', 'MiSans',
          'Microsoft YaHei', sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --r-sm: 6px;
        --r-md: 10px;
        --r-lg: 14px;
        --r-full: 9999px;
        --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
        --dur: 160ms;
      }
      [data-theme='dark'] {
        --canvas: #16120f;
        --panel: #1e1915;
        --panel-2: #26201a;
        --panel-sunk: #14100d;
        --line-hair: #2b241d;
        --line: #3a312a;
        --line-strong: #51453a;
        --ink: #f7eee3;
        --ink-body: #e0d4c3;
        --ink-muted: #b5a592;
        --ink-faint: #9a8b76;
        --accent: #e9a63f;
        --accent-deep: #f2b862;
        --accent-soft: #372814;
        --accent-line: #57401f;
        --on-accent: #1b1510;
        --ok: #8cbf70;
        --ok-soft: #1f2c1a;
        --ok-line: #34492c;
        --warn: #e0b055;
        --warn-soft: #302511;
        --warn-line: #4c3a18;
        --danger: #e8836f;
        --danger-soft: #36201a;
        --danger-line: #57302a;
        --info: #7fb4d2;
        --info-soft: #182832;
        --info-line: #2a414f;
        --shadow-1:
          0 1px 2px color-mix(in srgb, #000 34%, transparent),
          0 1px 1px color-mix(in srgb, #000 24%, transparent);
        --shadow-2:
          0 4px 16px -4px color-mix(in srgb, #000 50%, transparent),
          0 2px 4px color-mix(in srgb, #000 30%, transparent);
        --shadow-3:
          0 24px 48px -16px color-mix(in srgb, #000 68%, transparent),
          0 8px 16px -8px color-mix(in srgb, #000 45%, transparent);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink-body);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.72;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      h1,
      h2,
      h3,
      h4 {
        margin: 0;
        color: var(--ink);
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.35;
      }
      h1 {
        font-size: 30px;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }
      h2 {
        font-size: 21px;
      }
      h3 {
        font-size: 16px;
        line-height: 1.4;
      }
      h4 {
        font-size: 14px;
      }
      p {
        margin: 0 0 10px;
      }
      p:last-child {
        margin-bottom: 0;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid var(--accent-line);
      }
      a:hover {
        border-bottom-color: var(--accent);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      code,
      pre,
      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      svg.ico {
        width: 15px;
        height: 15px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      svg.ico.lg {
        width: 17px;
        height: 17px;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 3px;
      }
      ::selection {
        background: var(--accent-soft);
        color: var(--ink);
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }
      .prose {
        max-width: 68ch;
      }
      .muted {
        color: var(--ink-muted);
      }
      .faint {
        color: var(--ink-faint);
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* ── 顶栏 58px ───────────────────────────────────────────────────────────── */
      .top {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 14px;
        height: 58px;
        padding: 0 18px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .mark {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        flex: none;
        display: grid;
        place-items: center;
        background: linear-gradient(150deg, var(--accent) 0%, var(--accent-deep) 100%);
        color: var(--on-accent);
        font-size: 15px;
        font-weight: 700;
        box-shadow: var(--shadow-1);
      }
      .top .name {
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.01em;
        line-height: 1.2;
      }
      .top .sub {
        font-size: 11.5px;
        color: var(--ink-muted);
        line-height: 1.2;
      }
      .top .grow {
        flex: 1;
      }
      .top .host {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--ink-muted);
      }
      .seg {
        display: inline-flex;
        padding: 2px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        gap: 2px;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--ink-muted);
        font-size: 12.5px;
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
        transition:
          background var(--dur) var(--ease),
          color var(--dur) var(--ease);
      }
      .seg button[aria-pressed='true'] {
        background: var(--panel);
        color: var(--ink);
        box-shadow: var(--shadow-1);
      }
      .seg button:hover {
        color: var(--ink);
      }

      /* ── 侧栏 216px ──────────────────────────────────────────────────────────── */
      .shell {
        display: grid;
        grid-template-columns: 216px minmax(0, 1fr);
        align-items: start;
      }
      .side {
        position: sticky;
        top: 58px;
        height: calc(100vh - 58px);
        overflow: auto;
        background: var(--canvas);
        border-right: 1px solid var(--line);
        padding: 14px 10px 16px;
      }
      .nav-g {
        margin-bottom: 14px;
      }
      .nav-h {
        font-size: 11.5px;
        color: var(--ink-faint);
        padding: 6px 10px;
        letter-spacing: 0.02em;
      }
      .nav-i {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        padding: 7px 10px;
        margin: 1px 0;
        border: 0;
        background: transparent;
        border-radius: var(--r-md);
        cursor: pointer;
        text-align: left;
        color: var(--ink-body);
        font-size: 14px;
        position: relative;
        transition:
          background var(--dur) var(--ease),
          color var(--dur) var(--ease);
      }
      .nav-i:hover {
        background: var(--panel-2);
        color: var(--ink);
      }
      .nav-i.on {
        background: var(--accent-soft);
        color: var(--accent-deep);
        font-weight: 600;
      }
      .nav-i.on::before {
        content: '';
        position: absolute;
        left: -10px;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: var(--accent);
        border-radius: 0 2px 2px 0;
      }
      .nav-i .cnt {
        margin-left: auto;
        font-size: 11.5px;
        color: var(--ink-faint);
        font-variant-numeric: tabular-nums;
      }
      .nav-i.on .cnt {
        color: var(--accent-deep);
      }
      .side-foot {
        border-top: 1px solid var(--line-hair);
        margin-top: 6px;
        padding: 10px 10px 0;
        font-size: 11.5px;
        color: var(--ink-faint);
        line-height: 1.6;
        word-break: break-all;
      }

      /* ── 主区 ────────────────────────────────────────────────────────────────── */
      main {
        padding: 26px 30px 64px;
        min-width: 0;
      }
      .vh {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 18px;
      }
      .vh .t {
        flex: 1;
        min-width: 0;
      }
      .vh .t p {
        margin: 4px 0 0;
        color: var(--ink-muted);
        font-size: 13.5px;
        max-width: 68ch;
      }
      .vh .a {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .row-flex {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .g2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .g3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      .g4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
      .g-side {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 16px;
        align-items: start;
      }
      .g-side-l {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }

      /* ── card ────────────────────────────────────────────────────────────────── */
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        box-shadow: var(--shadow-1);
      }
      .card-h {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--line-hair);
        min-height: 44px;
      }
      .card-h h3 {
        flex: 1;
        min-width: 0;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-h .sub {
        font-size: 11.5px;
        color: var(--ink-faint);
      }
      .card-b {
        padding: 14px;
      }
      .card-b.tight {
        padding: 0;
      }
      .card-f {
        padding: 10px 14px;
        border-top: 1px solid var(--line-hair);
        background: var(--panel);
        border-radius: 0 0 var(--r-md) var(--r-md);
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      /* ── stat ────────────────────────────────────────────────────────────────── */
      .stat {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        padding: 12px 14px;
        box-shadow: var(--shadow-1);
      }
      .stat .k {
        font-size: 12px;
        color: var(--ink-faint);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stat .v {
        font-size: 27px;
        font-weight: 600;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        line-height: 1.25;
        margin-top: 2px;
      }
      .stat .n {
        font-size: 12px;
        color: var(--ink-muted);
      }
      .g-fly {
        display: grid;
        grid-template-columns: 1.75fr 1fr 1fr 1fr;
        gap: 14px;
      }
      .stat.hero {
        background: var(--accent-soft);
        border-color: var(--accent-line);
      }
      .stat.hero .v {
        color: var(--accent-deep);
        font-size: 34px;
      }

      /* ── 按钮 ────────────────────────────────────────────────────────────────── */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: var(--r-sm);
        cursor: pointer;
        font-size: 13.5px;
        padding: 6px 12px;
        border: 1px solid transparent;
        white-space: nowrap;
        transition:
          background var(--dur) var(--ease),
          border-color var(--dur) var(--ease),
          color var(--dur) var(--ease);
      }
      .btn-p {
        background: var(--accent);
        color: var(--on-accent);
        border-color: var(--accent);
        box-shadow: var(--shadow-1);
      }
      .btn-p:hover {
        background: var(--accent-deep);
        border-color: var(--accent-deep);
      }
      .btn-s {
        background: var(--panel);
        color: var(--ink-body);
        border-color: var(--line-strong);
      }
      .btn-s:hover {
        background: var(--panel-2);
        color: var(--ink);
        border-color: var(--ink-faint);
      }
      .btn-g {
        background: transparent;
        color: var(--ink-muted);
      }
      .btn-g:hover {
        background: var(--panel-2);
        color: var(--ink);
      }
      .btn-d {
        background: var(--danger-soft);
        color: var(--danger);
        border-color: var(--danger-line);
      }
      .btn-d:hover {
        background: var(--danger);
        color: var(--panel);
        border-color: var(--danger);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn.sm {
        padding: 3px 8px;
        font-size: 12px;
        gap: 4px;
      }
      .btn.xs {
        padding: 1px 6px;
        font-size: 11.5px;
      }

      /* ── chip（六形制：soft 底 + 同色 line + 同色 solid 字，永远配图标+文字） ── */
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11.5px;
        line-height: 1.7;
        padding: 1px 9px;
        border-radius: var(--r-full);
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .chip svg.ico {
        width: 12px;
        height: 12px;
        stroke-width: 2;
      }
      .chip.accent {
        background: var(--accent-soft);
        border-color: var(--accent-line);
        color: var(--accent-deep);
      }
      .chip.ok {
        background: var(--ok-soft);
        border-color: var(--ok-line);
        color: var(--ok);
      }
      .chip.warn {
        background: var(--warn-soft);
        border-color: var(--warn-line);
        color: var(--warn);
      }
      .chip.danger {
        background: var(--danger-soft);
        border-color: var(--danger-line);
        color: var(--danger);
      }
      .chip.info {
        background: var(--info-soft);
        border-color: var(--info-line);
        color: var(--info);
      }
      button.chip {
        cursor: pointer;
        font-size: 12px;
        padding: 3px 11px;
      }
      button.chip[aria-pressed='true'] {
        background: var(--accent-soft);
        border-color: var(--accent-line);
        color: var(--accent-deep);
        font-weight: 600;
      }
      /* .tag = 元信息标签（纯文字，无状态语义）。chip 专供状态：图标 + 文字 + 颜色三通道，一个都不少。 */
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11.5px;
        line-height: 1.7;
        padding: 1px 8px;
        border-radius: var(--r-sm);
        border: 1px solid var(--line-hair);
        background: var(--panel-2);
        color: var(--ink-muted);
        white-space: nowrap;
        max-width: 100%;
      }
      .tag.mono {
        font-family: var(--mono);
        font-size: 11.5px;
      }
      .tag.accent {
        background: var(--accent-soft);
        border-color: var(--accent-line);
        color: var(--accent-deep);
      }
      .tag.ok {
        background: var(--ok-soft);
        border-color: var(--ok-line);
        color: var(--ok);
      }
      .tag.warn {
        background: var(--warn-soft);
        border-color: var(--warn-line);
        color: var(--warn);
      }
      .tag.info {
        background: var(--info-soft);
        border-color: var(--info-line);
        color: var(--info);
      }
      button.tag {
        cursor: pointer;
        font-size: 12px;
        padding: 3px 10px;
      }
      button.tag:hover {
        background: var(--panel);
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .tag[aria-pressed='true'] {
        background: var(--accent-soft);
        border-color: var(--accent-line);
        color: var(--accent-deep);
        font-weight: 600;
      }

      /* ── 输入 ────────────────────────────────────────────────────────────────── */
      .input,
      select.input,
      textarea.input {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--line-strong);
        border-radius: var(--r-sm);
        padding: 6px 10px;
        font-size: 13.5px;
        color: var(--ink);
        transition:
          border-color var(--dur) var(--ease),
          box-shadow var(--dur) var(--ease);
      }
      .input::placeholder {
        color: var(--ink-faint);
      }
      .input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      textarea.input {
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.7;
        resize: vertical;
      }
      .input.mono {
        font-family: var(--mono);
        font-size: 12.5px;
      }
      label.fl {
        display: block;
        font-size: 12px;
        color: var(--ink-muted);
        margin: 0 0 4px;
      }
      .search {
        position: relative;
      }
      .search .ico {
        position: absolute;
        left: 9px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--ink-faint);
      }
      .search .input {
        padding-left: 29px;
      }

      /* ── 台账表 ──────────────────────────────────────────────────────────────── */
      .tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .tbl th {
        text-align: left;
        font-size: 11.5px;
        color: var(--ink-faint);
        font-weight: 500;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .tbl td {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line-hair);
        color: var(--ink-body);
        vertical-align: middle;
      }
      .tbl tr:last-child td {
        border-bottom: 0;
      }
      .tbl tbody tr:hover {
        background: var(--panel-2);
      }
      .tbl .r {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .tbl .path {
        font-family: var(--mono);
        font-size: 12px;
        word-break: break-all;
      }

      /* ── 行列表 ──────────────────────────────────────────────────────────────── */
      .rows {
        display: flex;
        flex-direction: column;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 9px 13px;
        border-bottom: 1px solid var(--line-hair);
        cursor: pointer;
        background: transparent;
        border-left: 0;
        border-right: 0;
        border-top: 0;
        width: 100%;
        text-align: left;
        transition: background var(--dur) var(--ease);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row:hover {
        background: var(--panel-2);
      }
      .row[aria-selected='true'] {
        background: var(--accent-soft);
      }
      .row .m {
        flex: 1;
        min-width: 0;
      }
      .row .m b {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .m span {
        display: block;
        font-size: 11.5px;
        color: var(--ink-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .rt {
        flex: none;
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 11.5px;
        color: var(--ink-faint);
      }

      /* ── note 四态 / empty-hint ──────────────────────────────────────────────── */
      .note {
        border-radius: var(--r-md);
        padding: 10px 13px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        font-size: 13px;
      }
      .note b {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--ink);
        font-size: 13px;
        margin-bottom: 3px;
      }
      .note p {
        color: var(--ink-body);
      }
      .note.ok {
        background: var(--ok-soft);
        border-color: var(--ok-line);
      }
      .note.ok b {
        color: var(--ok);
      }
      .note.warn {
        background: var(--warn-soft);
        border-color: var(--warn-line);
      }
      .note.warn b {
        color: var(--warn);
      }
      .note.danger {
        background: var(--danger-soft);
        border-color: var(--danger-line);
      }
      .note.danger b {
        color: var(--danger);
      }
      .note.info {
        background: var(--info-soft);
        border-color: var(--info-line);
      }
      .note.info b {
        color: var(--info);
      }
      .note.accent {
        background: var(--accent-soft);
        border-color: var(--accent-line);
      }
      .note.accent b {
        color: var(--accent-deep);
      }
      .empty {
        border: 1px dashed var(--line-strong);
        border-radius: var(--r-md);
        padding: 26px 18px;
        text-align: center;
      }
      .empty p {
        color: var(--ink-faint);
        font-size: 13px;
        margin: 8px 0 12px;
      }
      .empty .ico {
        width: 22px;
        height: 22px;
        color: var(--ink-faint);
        stroke-width: 1.4;
      }

      /* ── pre / meter ─────────────────────────────────────────────────────────── */
      pre.pre {
        background: var(--panel-sunk);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 11px 13px;
        font-size: 12.5px;
        line-height: 1.7;
        color: var(--ink-body);
        white-space: pre-wrap;
        word-break: break-word;
        overflow: auto;
        margin: 0;
        max-height: 460px;
      }
      code.inl {
        background: var(--panel-sunk);
        border: 1px solid var(--line-hair);
        border-radius: 4px;
        padding: 0 5px;
        font-size: 12px;
        color: var(--ink);
      }
      .meter {
        height: 6px;
        border-radius: 3px;
        background: var(--line-hair);
        overflow: hidden;
      }
      .meter i {
        display: block;
        height: 100%;
        min-width: 3px;
        background: var(--accent);
        border-radius: 3px;
      }
      .meter.warn i {
        background: var(--warn);
      }

      /* ── tabs（冲突处置：段数由数据给） ──────────────────────────────────────── */
      .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        font-size: 12.5px;
      }
      .kv dt {
        color: var(--ink-faint);
      }
      .kv dd {
        margin: 0;
        color: var(--ink-body);
        word-break: break-all;
      }
      .kv dd.mono {
        font-family: var(--mono);
        font-size: 12px;
      }
      .pill-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      /* ── 看板 ────────────────────────────────────────────────────────────────── */
      .board {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .col {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        padding: 10px;
        min-height: 90px;
      }
      .col-h {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        color: var(--ink);
        margin-bottom: 8px;
        padding: 0 2px;
      }
      .col-h .cnt {
        color: var(--ink-faint);
        font-variant-numeric: tabular-nums;
      }
      .col.on {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .task {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 8px 10px;
        margin-bottom: 7px;
        font-size: 13px;
        box-shadow: var(--shadow-1);
      }
      .task .h {
        display: flex;
        align-items: flex-start;
        gap: 7px;
      }
      .task .h b {
        font-weight: 500;
        color: var(--ink);
        flex: 1;
        line-height: 1.5;
      }
      .task.done .h b {
        color: var(--ink-muted);
        text-decoration: line-through;
      }
      .task .meta {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 6px;
        padding-left: 23px;
      }

      /* ── 步骤条 ──────────────────────────────────────────────────────────────── */
      .steps {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }
      .stp {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--ink-faint);
        padding: 3px 9px;
        border-radius: var(--r-full);

      .stp .n {
        width: 17px;
        height: 17px;

        place-items: center;

        color: var(--ink-muted);
        font-variant-numeric: tabular-nums;

      .stp.on .n {

      .stp.ok {

        background: var(--ok-soft);
        border-color: var(--ok-line);
        color: var(--ok);

        word-break: break-word;

        background: var(--danger-soft);
        color: var(--danger);
      }
      .diff .ins {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .diff .hunk {
        background: var(--panel-2);
        color: var(--ink-faint);
        border-top: 1px solid var(--line-hair);
        border-bottom: 1px solid var(--line-hair);
      }

      /* ── 浮层 ────────────────────────────────────────────────────────────────── */
      .scrim {
        position: fixed;
        inset: 0;
        background: color-mix(in srgb, var(--scrim) 40%, transparent);
        z-index: 60;
        animation: fade var(--dur) var(--ease);

      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .dlg {
        position: fixed;
        z-index: 61;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);

        max-height: calc(100vh - 48px);
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-3);

        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line-hair);
        position: sticky;
        top: 0;
        background: var(--panel);
      }
      .dlg-h h3 {
        flex: 1;
        font-size: 16px;
      }
      .dlg-b {
        padding: 18px;
      }
      .dlg-f {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        padding: 12px 18px;
        border-top: 1px solid var(--line-hair);
        position: sticky;
        bottom: 0;
        background: var(--panel);
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 26px;

        flex-direction: column;

        align-items: center;

      @keyframes rise {
        from {

          transform: translateY(6px);
        }
        to {
          opacity: 1;

        }
      }

      .skel {
        background: var(--panel-2);
        border-radius: var(--r-sm);

      @keyframes pulse {

        to {
          opacity: 1;
        }
      }
      /* ── 文件树 ──────────────────────────────────────────────────────────────── */
      .tree {
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .tree .f {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 5px 9px;
        border-radius: var(--r-sm);
        cursor: pointer;
        border: 1px solid transparent;
        width: 100%;
        background: transparent;
        text-align: left;
      }
      .tree .f:hover {
        background: var(--panel-2);
      }
      .tree .f[aria-selected='true'] {
        background: var(--accent-soft);
        border-color: var(--accent-line);
        color: var(--accent-deep);
      }
      .tree .f .sz {
        margin-left: auto;
        color: var(--ink-faint);
        font-size: 11.5px;
      }
      .tree .dir {
        color: var(--ink-faint);
        padding: 5px 9px;
        display: flex;
        gap: 6px;
        align-items: center;
      }

      /* ── 断点（就近取 lg 1024 / md 768 / sm 640） ─────────────────────────────── */
      @media (max-width: 1100px) {
        .g-side,
        .g-side-l {
          grid-template-columns: minmax(0, 1fr);
        }
        .g4 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .g-fly {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 900px) {
        .shell {
          grid-template-columns: minmax(0, 1fr);
        }
        .side {
          position: static;
          height: auto;
          display: flex;
          gap: 6px;
          overflow-x: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .nav-g {
          margin: 0;
          display: flex;
          gap: 4px;
        }
        .nav-h {
          display: none;
        }
        .nav-i {
          width: auto;
          white-space: nowrap;
          padding: 6px 10px;
        }
        .nav-i .cnt,
        .side-foot {
          display: none;
        }
        main {
          padding: 16px;
        }
        .g2,
        .g3,
        .board {
          grid-template-columns: minmax(0, 1fr);
        }
        h1 {
          font-size: 25px;
        }
      }
    </style>
  </head>

    <script>
      'use strict'
      /* ═══════════════ 0 · 图标与工具 ═══════════════ */
      const ico = (n, c = '') =>
        `<svg class="ico ${c}" viewBox="0 0 20 20" aria-hidden="true"><use href="#i-${n}"/></svg>`
      const $ = (s) => document.querySelector(s)
      const $$ = (s) => [...document.querySelectorAll(s)]
      const h = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        )
      const kb = (b) => (b / 1024).toFixed(1) + ' kB'
      /* token 估算：与 packages/core/src/pack/size.ts 同口径（CJK 1.2/字，其余 4 字符/token） */
      function estimateTokens(s) {
        const cp = Array.from(s)
        let cjk = 0,
          other = 0
        for (const ch of cp) {
          const u = ch.codePointAt(0)
          if (
            (u >= 0x4e00 && u <= 0x9fff) ||
            (u >= 0x3400 && u <= 0x4dbf) ||
            (u >= 0x3040 && u <= 0x30ff) ||
            (u >= 0xff00 && u <= 0xff60) ||
            (u >= 0xf900 && u <= 0xfaff)
          )
            cjk++
          else other++
        }
        return { cjk, other, approxTokens: Math.ceil(other / 4 + cjk * 1.2) }
      }

          if (inList) {
            out.push('</ul>')

        }
        for (const raw of esc.split('\n')) {

          }
          if (inCode) {
            out.push(raw)

          }
          if (/^\d+\.\s|^- /.test(raw)) {
            if (!inList) {
              out.push('<ul style="margin:4px 0;padding-left:20px">')

            }
            out.push(`<li>${inline(raw.replace(/^(?:\d+\.\s|- )/, ''))}</li>`)
            continue

          closeList()
          if (/^#{1,4}\s/.test(raw)) {
            const lv = Math.min(raw.match(/^#+/)[0].length + 2, 6)
            out.push(
              `<h${lv} style="margin:14px 0 6px">${inline(raw.replace(/^#+\s/, ''))}</h${lv}>`,

      function lineDiff(a, b) {
        const A = a.split('\n'),
          B = b.split('\n'),
          n = A.length,
          m = B.length
        const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1))
        for (let i = n - 1; i >= 0; i--)
          for (let j = m - 1; j >= 0; j--)
            dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1])
        const out = []
        let i = 0,
          j = 0
        while (i < n && j < m) {
          if (A[i] === B[j]) {
            out.push([0, A[i]])
            i++
            j++
          } else if (dp[i + 1][j] >= dp[i][j + 1]) {
            out.push([-1, A[i]])
            i++
          } else {
            out.push([1, B[j]])
            j++
          }
        }
        while (i < n) out.push([-1, A[i++]])
        while (j < m) out.push([1, B[j++]])
        return out
      }

      function genFiles(pk) {
        const ps = pk.prompts.map((id) => DB.prompts.find((p) => p.id === id)).filter(Boolean)

          rules.forEach((p) => {

          L.push('## 流程清单')
          flow.stages.forEach((s) => {

      function groupTree(files) {

      /* ── 设置 · 第 7 区：可读性与设计系统（运行时真算对比度） ───────────────── */
      function lum(hex) {
        const v = hex.replace('#', '')
        const c = [0, 2, 4]
          .map((i) => parseInt(v.substr(i, 2), 16) / 255)
          .map((x) => (x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4)))
        return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]
      }
      function ratio(a, b) {
        const l1 = lum(a),
          l2 = lum(b)
        const [hi, lo] = l1 > l2 ? [l1, l2] : [l2, l1]
        return (hi + 0.05) / (lo + 0.05)
      }
      const A11Y_PAIRS = [
        ['--ink', '--panel', '标题 / 卡片'],
        ['--ink-body', '--panel-2', '正文 / 悬浮底'],
        ['--ink-muted', '--panel-2', '说明 / 悬浮底'],
        ['--ink-faint', '--panel-sunk', '元信息 / 代码块底'],
        ['--accent', '--canvas', '链接 / 画布'],

            title: `追加 ${'DEV'} 记录 · 预填 #${String(no).padStart(4, '0')}`,
            body: `<div class="stack">
        <div class="row-flex"><span class="tag info">DEV</span><span class="tag">CHECK</span>
          <span class="faint mono" style="font-size:11.5px">编号递增 · 时间戳 ${nowStamp().slice(0, 16)}</span></div>
        <div><label class="fl">正文</label><textarea class="input" id="lg-b" rows="4" placeholder="做了什么、为什么这么改"></textarea></div>
        <div class="row-flex"><div style="flex:1"><label class="fl">关联文件</label><input class="input mono" id="lg-f"></div>
          <div style="flex:1"><label class="fl">验证命令</label><input class="input mono" id="lg-c" value="pnpm test"></div></div></div>`,
            foot: `<button class="btn btn-g" data-act="close-dlg">取消</button>
        <button class="btn btn-p" data-act="add-log-do" data-id="${p.id}" data-no="${no}">${ico('check')}写入日志</button>`,
          })
        },
        'add-log-do': (el) => {
          const p = DB.projects.find((x) => x.id === el.dataset.id)
          const b = $('#lg-b').value.trim()
          if (!b) {
            toast('正文不能为空', 'alert')
            return
          }
          p.logs.unshift({
            no: +el.dataset.no,
            type: 'DEV',
            at: nowStamp().slice(0, 16),
            body: b,
            ev: { file: $('#lg-f').value || '—', cmd: $('#lg-c').value || '—', res: '待回填' },
          })
          closeDlg()
          log('沉淀', `DEV #${String(+el.dataset.no).padStart(4, '0')} · ${p.name}`, p.path)
          toast('已写入 · 编号自动递增')
          render()
        },
        reflow: (el) =>
          openDlg({
            title: '复盘回流 · 候选确认',
            wide: true,
            body: reflowHtml(DB.projects.find((x) => x.id === el.dataset.id)),
          }),
        'accept-reflow': (el) => {
          const p = DB.projects.find((x) => x.id === el.dataset.pj)
          const c = reflowCandidates[+el.dataset.i]
          if (c.type === 'term' && !DB.terms.some((t) => t.zh === c.zh))
            DB.terms.push({
              id: 'tm_' + Date.now().toString(36),
              zh: c.zh,
              en: c.en,
              aliases: [],
              def: c.def,
              ex: c.why,
              src: `复盘回流 · ${p.name}`,
              tags: ['回流'],
              rel: [],
            })
          p.reflow = (p.reflow || 0) + 1
          log('回流', '候选已入库：' + c.zh, p.path)
          toast('已入库 · 下一个标准包自动更优')
          openDlg({ title: '复盘回流 · 候选确认', wide: true, body: reflowHtml(p) })
          render()
        },
        'skip-reflow': (el) => {
          const p = DB.projects.find((x) => x.id === el.dataset.pj)
          toast('已丢弃该候选 · 不入库')
          openDlg({ title: '复盘回流 · 候选确认', wide: true, body: reflowHtml(p) })
        },
        'diff-project': () =>
          openDlg({
            title: `漂移对照 · ${DB.plan.project}`,
            wide: true,
            body: `<div class="stack"><div class="note warn"><b>${ico('warn')}只读对照</b>
      <p>磁盘 sha vs 注入登记 sha。Web 侧不改任何文件，处置决定在 CLI 执行时生效。</p></div>
      <div class="card"><div class="card-h"><h3>CLAUDE.md · 段级差异</h3></div><div class="card-b">
      ${diffHTML(
        lineDiff(
          `# bid-board 项目规则

## 行为规则
### 需求 → Spec 拆解
- 每条验收标准可判定真假
- 不确定的地方标「待确认」

## 流程清单
### 实现
- [ ] 实现前：上下文文件已注入
- [x] 合并前：测试通过`,
          `# bid-board 项目规则
> 本文件由 OpenVibe 标准包 finsec-onboarding@0.2.0 生成（指纹 7b3e05aa）。请勿手工编辑：下次 sync 会覆盖未改动版本。

## 行为规则
### 需求 → Spec 拆解
- 每条验收标准可判定真假，不许出现「优化体验」这类不可测表述
- 不确定的地方标「待确认」，不要自行发明需求

### 代码评审（含安全）
- 评审维度：正确性 → 安全 → 可维护 → 影响面

## 流程清单
### 实现
- [ ] 实现前：上下文文件已注入
- [ ] 合并前：测试通过
### 审查
- [ ] 自审清单跑完
- [ ] 安全维度已过`,
        ),
      )}
      <p class="faint" style="font-size:11.5px">− 磁盘现状（本地改动过） / + 包内新版</p></div></div></div>`,
          }),
        /* 标准包 */
        'pick-pack': (el) => {
          S.packId = el.dataset.id
          S.curFile = ''
          render()
        },
        'pick-file': (el) => {
          S.curFile = el.dataset.p
          render()
        },
        'copy-file': () => {
          const pk = DB.packs.find((p) => p.id === S.packId)
          copy(genFiles(pk).find((f) => f.path === S.curFile)?.content || '', '已复制 ' + S.curFile)
        },
        'copy-dir': (el) => {
          const pk = DB.packs.find((p) => p.id === S.packId)
          const files = genFiles(pk)
            .map((f) => `# ── ${f.path} ──\n${f.content}`)
            .join('\n\n')
          copy(files, '已复制整目录（' + pk.name + '）')
        },
        'pack-diff': () =>
          openDlg({
            title: '注入干跑 · 只读计划',
            wide: true,
            body: dryRunHtml(),
            foot: `<button class="btn btn-g" data-act="close-dlg">关闭</button>
      <button class="btn btn-s" data-act="dryrun-cmd">${ico('copy')}复制 sync 命令</button>
      <button class="btn btn-p" data-act="simulate-inject">${ico('dl')}记录本次注入</button>`,
          }),
        decide: (el) => {
          S.decided[el.dataset.p] = el.dataset.d
          openDlg({
            title: '注入干跑 · 只读计划',
            wide: true,
            body: dryRunHtml(),
            foot: `<button class="btn btn-g" data-act="close-dlg">关闭</button>
        <button class="btn btn-s" data-act="dryrun-cmd">${ico('copy')}复制 sync 命令</button>
        <button class="btn btn-p" data-act="simulate-inject">${ico('dl')}记录本次注入</button>`,
          })
        },
        'dryrun-cmd': () => copy(`openvibe sync '${DB.plan.project}'`, '已复制命令'),
        'simulate-inject': () => {
          const pk = DB.packs.find((p) => p.id === DB.plan.pack)
          closeDlg()
          log('注入', `${pk.name}@${pk.ver} → ${DB.plan.project}（created）`, DB.plan.project)
          DB.plan.files.forEach((f) => {
            if (f.status === 'DRIFT') f.status = 'IN_SYNC'
          })
          toast('已记录 · Web 不落盘，真写入由 CLI 执行')
          if (!S.telemetry.asked) S.telemetry.asked = true
          render()
        },
        'wizard-pack': () => {
          S.wizard = { on: true, step: 0 }
          wizardStep()
        },
        'wz-next': () => {
          S.wizard.step++
          wizardStep()
        },
        'wz-prev': () => {
          S.wizard.step--
          wizardStep()
        },
        'wz-flow': (el) => {
          WIZ.flow = el.dataset.id
          wizardStep()
        },
        'wz-pick': (el) => {
          const k = el.dataset.k,
            id = el.dataset.id
          const m = { prompts: 'prompts', terms: 'terms', skills: 'skills' }[k]
          WIZ[m] = WIZ[m].includes(id) ? WIZ[m].filter((x) => x !== id) : [...WIZ[m], id]
          wizardStep()
        },
        'wz-all-terms': () => {
          WIZ.terms = DB.terms.map((t) => t.id)
          toast('术语全选 · 种子共 109 条，本原型 13 条')
          wizardStep()
        },
        'wz-target': (el) => {
          const t = el.dataset.t
          WIZ.targets = WIZ.targets.includes(t)
            ? WIZ.targets.filter((x) => x !== t)
            : [...WIZ.targets, t]
          wizardStep()
        },
        'wz-done': () => {
          const fp = packFootprint({ ...WIZ, fingerprint: '0f1e2d3c' })
          const pk = {
            id: 'pk_' + Date.now().toString(36),
            name: WIZ.name,
            ver: WIZ.ver,
            builtin: false,
            desc: WIZ.desc || '（未填描述）',
            prompts: WIZ.prompts,
            terms: WIZ.terms.length ? WIZ.terms : 'all',
            skills: WIZ.skills,
            flow: WIZ.flow,
            targets: WIZ.targets,
            fingerprint: '0f1e2d3c',
            exported: nowStamp().slice(0, 16),
            ex: '0 次',
          }
          DB.packs.push(pk)
          S.packId = pk.id
          S.curFile = ''
          closeDlg()
          log('组包', `${pk.name}@${pk.ver} · ${fp.files.length} 个文件 · ≈${fp.tok} tok`)
          toast(`已生成 ${pk.name}@${pk.ver} · ${fp.files.length} 个文件`)
          render()
        },
      }
      const reflowCandidates = [
        {
          type: 'term',
          zh: '规则漂移',
          en: 'rule drift',
          def: '同一会话内模型逐渐偏离规则文件约束的现象；与「指令被覆盖」要分开记账。',
          why: '来自 CHECK #007：第 12 轮改动违反第 3 轮约束',
        },
        { type: 'playbook', title: '上下文文件先注入再开工', why: '来自 CHECK #007' },
        { type: 'prompt', why: '本轮评审漏了密钥落日志一项，提示词本身没有这一维度' },
      ]

      /* ═══════════════ 6 · 路由与事件 ═══════════════ */
      function render() {
        const route = location.hash.replace(/^#/, '').split('?')[0] || '/'
        S.route = route
        renderNav()
        const html = route.startsWith('/projects/')
          ? projectView(route.slice(10))
          : (VIEWS[route] || VIEWS['/'])()
        $('#view').innerHTML = html
        const t = $('#view h1')
        if (t) document.title = t.textContent + ' · OpenVibe 灵典'
      }
      /* 向导第 1 步：输入时只做轻量刷新，不重绘弹窗（否则输入框会被抢焦点） */
      function wzRefresh() {
        const btn = $('#wz-next-btn'),
          err = $('#wz-err')
        const dup = !!WIZ.name && DB.packs.some((p) => p.name === WIZ.name)
        if (btn) btn.disabled = !WIZ.name || dup
        if (err) err.style.display = dup ? '' : 'none'
      }
      window.addEventListener('hashchange', () => {
        S.q = ''
        S.tag = ''
        render()
        $('#view').focus()
      })
      document.addEventListener('click', (e) => {
        const nav = e.target.closest('[data-nav]')
        if (nav) {
          if (nav.tagName !== 'INPUT') {
            location.hash = '#' + nav.dataset.nav
          }
          return
        }
        const np = e.target.closest('[data-np-plat]')
        if (np) {
          np.setAttribute(
            'aria-pressed',
            np.getAttribute('aria-pressed') === 'true' ? 'false' : 'true',
          )
          return
        }
        const el = e.target.closest('[data-act]')
        if (!el || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return
        ACT[el.dataset.act]?.(el, e)
      })
      document.addEventListener('input', (e) => {
        const t = e.target
        if (t.id === 'p-body') return onEditBody(t)
        if (t.id === 'q-prompt' || t.id === 'q-term') {
          S.q = t.value
          const pos = t.selectionStart
          render()
          const n = $(t.id)
          if (n) {
            n.focus()
            n.setSelectionRange(pos, pos)
          }
          return
        }
        if (t.id.startsWith('wz-')) {
          WIZ[{ 'wz-name': 'name', 'wz-desc': 'desc', 'wz-ver': 'ver' }[t.id]] = t.value
          wzRefresh()
          return
        }
        if (t.hasAttribute('data-var')) {
          const p = DB.prompts.find((x) => x.id === S.pId)
          let out = p.content
          $$('[data-var]').forEach((i) => {
            out = out
              .split('{{' + i.dataset.var + '}}')
              .join(i.value || '{{' + i.dataset.var + '}}')
          })
          const pv = $('#var-prev')
          if (pv) pv.textContent = out
        }
      })
      document.addEventListener('change', (e) => {
        const t = e.target
        if (!t.dataset.act) return
        const d = t.dataset
        if (d.act === 'check') {
          S.check[d.key] = t.checked
          toast(t.checked ? '已勾选' : '已取消勾选')
          render()
          return
        }
        if (d.act === 'sel-term' || d.act === 'wz-pick') {
          ACT[d.act](t)
          return
        }
      })
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && $('#layer').innerHTML) {
          closeDlg()
          return
        }
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return
        if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && e.target.closest('#board')) {
          const b = $('#board'),
            pjId = b.dataset.pj,
            p = DB.projects.find((x) => x.id === pjId)
          if (!p) return
          const dir = e.key === 'ArrowRight' ? 1 : -1
          const first = p.tasks.find((t) => t.s !== 'done') || p.tasks[0]
          if (first && dir > 0 && first.s !== 'done') {
            const t = p.tasks.find((x) => x.id === first.id)
            t.s = t.s === 'todo' ? 'doing' : 'done'
            render()
            toast(t.s === 'done' ? '已完成' : '已推进到进行中')
          } else if (dir < 0 && p.tasks.find((t) => t.s === 'done')) {
            const t = [...p.tasks].reverse().find((x) => x.s === 'done')
            t.s = 'doing'
            render()
            toast('已退回进行中')
          }
        }
      })
      function setTheme(t) {
        document.documentElement.dataset.theme = t
        $('#th-paper').setAttribute('aria-pressed', t === 'paper')
        $('#th-dark').setAttribute('aria-pressed', t === 'dark')
        try {
          localStorage.setItem('ov-theme', t)
        } catch (e) {}
        if (S.route === '/settings') render()
      }
      $('#th-paper').addEventListener('click', () => setTheme('paper'))
      $('#th-dark').addEventListener('click', () => setTheme('dark'))
      try {
        const saved = localStorage.getItem('ov-theme')
        if (saved === 'dark' || saved === 'paper') setTheme(saved)
      } catch (e) {}
      if (!location.hash) location.hash = '#/'
      render()
    </script>
  </body>
</html>
