<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenVibe 灵典 · 暖纸 V2 · 可读性交互 Demo</title>
<meta name="description" content="暖色系高可读性前端交互演示：真实种子内容 + 运行时对比度自检。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'" />
<noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" /></noscript>
<style>
/* ============================================================================
   暖纸 V2 · 设计 token（唯一出处）
   规则：所有颜色只在这里出现一次。调用点只写 var(--xxx)，不写字面色值。
   文字色按「角色」命名而非色阶：同一 shade 在不同底色上承担不同职责。
   ========================================================================== */
:root {
  /* 表面 */
  --canvas:        #faf5ec;
  --canvas-2:      #f4ecdf;
  --panel:         #fffdf9;
  --panel-2:       #f8f1e6;
  --panel-sunk:    #f1e7d8;

  /* 描边 */
  --line-hair:     #efe5d5;
  --line:          #e3d6c1;
  --line-strong:   #cdbca2;

  /* 文字（暖墨，不用纯黑：纯黑在暖底上视觉过硬） */
  --ink:           #2a2018;   /* 标题 / 强调 */
  --ink-body:      #4a3b2d;   /* 正文 */
  --ink-muted:     #6a5846;   /* 次要说明 */
  --ink-faint:     #806e5a;   /* 元信息 / 标签，不承载长文本（对 panel 4.81:1，卡在 AA 线上方） */

  /* 强调：赭石 */
  --accent:        #a8501c;
  --accent-deep:   #7c3811;
  --accent-soft:   #f7e8d7;
  --accent-line:   #e4c9ab;
  --on-accent:     #fffaf3;

  /* 状态（软容器 + 实心两形态，分开是因为合并会改对比度） */
  --ok:            #3d6b37;   --ok-soft:    #ecf2e3;   --ok-line:   #c6dcbb;
  --warn:          #92610e;   --warn-soft:  #f9efd7;   --warn-line: #e6cf9d;
  --danger:        #ab3527;   --danger-soft:#fbe7e2;   --danger-line:#eec2b8;
  --info:          #2b5a74;   --info-soft:  #e4edf2;   --info-line: #bdd3df;

  --scrim:         rgba(42, 32, 24, .42);

  /* 阴影：只做扩散，不做硬边 */
  --sh-1: 0 1px 2px rgba(74, 52, 30, .05), 0 1px 1px rgba(74, 52, 30, .04);
  --sh-2: 0 4px 16px -4px rgba(74, 52, 30, .12), 0 2px 4px rgba(74, 52, 30, .05);
  --sh-3: 0 24px 48px -16px rgba(58, 40, 22, .26), 0 8px 16px -8px rgba(58, 40, 22, .12);

  /* 圆角 / 间距 */
  --r-1: 6px; --r-2: 10px; --r-3: 14px; --r-4: 20px;

  /* 字号：CJK 密集正文落在 15px，比拉丁默认更紧 */
  --fs-h1: 30px; --fs-h2: 21px; --fs-h3: 16px;
  --fs-body: 15px; --fs-sm: 13.5px; --fs-xs: 12.5px;
  --lh-body: 1.72; --lh-tight: 1.45;

  --font: 'Outfit', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --dur: 160ms;
}

[data-theme='night'] {
  --canvas:        #16120f;
  --canvas-2:      #1b1613;
  --panel:         #1e1915;
  --panel-2:       #26201a;
  --panel-sunk:    #14100d;
  --line-hair:     #2b241d;
  --line:          #3a312a;
  --line-strong:   #51453a;
  --ink:           #f7eee3;
  --ink-body:      #e0d4c3;
  --ink-muted:     #b5a592;
  --ink-faint:     #9a8b76;
  --accent:        #e9a63f;
  --accent-deep:   #f2b862;
  --accent-soft:   #372814;
  --accent-line:   #57401f;
  --on-accent:     #1b1510;
  --ok:            #8cbf70;   --ok-soft:    #1f2c1a;   --ok-line:   #34492c;
  --warn:          #e0b055;   --warn-soft:  #302511;   --warn-line: #4c3a18;
  --danger:        #e8836f;   --danger-soft:#36201a;   --danger-line:#57302a;
  --info:          #7fb4d2;   --info-soft:  #182832;   --info-line: #2a414f;
  --scrim:         rgba(8, 5, 3, .62);
  --sh-1: 0 1px 2px rgba(0, 0, 0, .34);
  --sh-2: 0 4px 16px -4px rgba(0, 0, 0, .5), 0 2px 4px rgba(0, 0, 0, .3);
  --sh-3: 0 24px 48px -16px rgba(0, 0, 0, .68), 0 8px 16px -8px rgba(0, 0, 0, .45);
}

/* --------------------------------------------------------------- base --- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink-body);
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3, h4 { color: var(--ink); line-height: var(--lh-tight); margin: 0; font-weight: 600; letter-spacing: -.01em; }
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
::selection { background: var(--accent-soft); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.mono { font-family: var(--mono); font-variant-ligatures: none; }
.num  { font-variant-numeric: tabular-nums; }
.prose { max-width: 68ch; }              /* 长文本行长闸门：超过就难读 */
.muted { color: var(--ink-muted); }
.faint { color: var(--ink-faint); }

/* -------------------------------------------------------------- shell --- */
.top {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 16px;
  padding: 0 20px; height: 58px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .mark {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  background: linear-gradient(150deg, var(--accent) 0%, var(--accent-deep) 100%);
  color: var(--on-accent); display: grid; place-items: center;
  font-size: 15px; font-weight: 700; box-shadow: var(--sh-1);
}
.brand b { font-size: 15px; color: var(--ink); font-weight: 600; letter-spacing: -.01em; }
.brand span { display: block; font-size: 11.5px; color: var(--ink-faint); line-height: 1.3; margin-top: -2px; }
.top .spacer { flex: 1; }

.shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); align-items: start; }
.side {
  position: sticky; top: 58px; height: calc(100dvh - 58px);
  padding: 16px 12px; border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 2px; overflow-y: auto;
}
.nav-i {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 8px 10px; border: 0; border-radius: var(--r-1);
  background: transparent; color: var(--ink-muted);
  font-size: var(--fs-sm); text-align: left; cursor: pointer;
  transition: background var(--dur), color var(--dur);
}
.nav-i svg { flex: none; opacity: .8; }
.nav-i:hover { background: var(--panel-2); color: var(--ink); }
.nav-i[aria-current='page'] { background: var(--accent-soft); color: var(--accent-deep); font-weight: 500; }
.nav-i[aria-current='page'] svg { opacity: 1; }
.nav-i u { margin-left: auto; font-size: 11px; text-decoration: none; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.nav-i[aria-current='page'] u { color: var(--accent); }
.side-f { margin-top: auto; padding: 12px 10px 2px; border-top: 1px solid var(--line-hair); font-size: 11.5px; color: var(--ink-faint); line-height: 1.6; }
.side-f code { font-size: 11px; color: var(--ink-muted); }

main { padding: 26px 30px 72px; min-width: 0; }
.view { max-width: 1120px; margin: 0 auto; animation: rise var(--dur) ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.vh { margin-bottom: 22px; }
.vh h1 { font-size: var(--fs-h1); letter-spacing: -.02em; }
.vh p { margin: 7px 0 0; color: var(--ink-muted); font-size: var(--fs-sm); max-width: 74ch; }

/* --------------------------------------------------------------- card --- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-2); box-shadow: var(--sh-1); }
.card-h { display: flex; align-items: center; gap: 8px; padding: 13px 16px; border-bottom: 1px solid var(--line-hair); }
.card-h h3 { font-size: var(--fs-h3); }
.card-h .sp { flex: 1; }
.card-b { padding: 16px; }
.card-b.tight { padding: 12px 16px; }

.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-side { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }

/* -------------------------------------------------------------- stats --- */
.stat { padding: 14px 16px; }
.stat .k { font-size: 12px; color: var(--ink-faint); letter-spacing: .02em; }
.stat .v { font-size: 27px; font-weight: 600; color: var(--ink); line-height: 1.25; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .d { font-size: 12px; color: var(--ink-muted); margin-top: 1px; }

/* ------------------------------------------------------------ buttons --- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: var(--r-1);
  border: 1px solid var(--line-strong); background: var(--panel);
  color: var(--ink-body); font-size: var(--fs-sm); font-weight: 500;
  cursor: pointer; white-space: nowrap;
  transition: background var(--dur), border-color var(--dur), color var(--dur), transform var(--dur);
}
.btn:hover { background: var(--panel-2); color: var(--ink); }
.btn:active { transform: translateY(.5px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: var(--sh-1); }
.btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-muted); }
.btn.ghost:hover { background: var(--panel-2); color: var(--ink); }
.btn.danger { background: var(--danger-soft); border-color: var(--danger-line); color: var(--danger); }
.btn.danger:hover { background: var(--danger); border-color: var(--danger); color: var(--panel); }
.btn.sm { padding: 4px 9px; font-size: var(--fs-xs); }
.btn.icon { padding: 5px; }

/* --------------------------------------------------------------- chip --- */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel-2);
  color: var(--ink-muted); font-size: 11.5px; line-height: 1.7; white-space: nowrap;
}
.chip.accent { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-deep); }
.chip.ok     { background: var(--ok-soft);     border-color: var(--ok-line);     color: var(--ok); }
.chip.warn   { background: var(--warn-soft);   border-color: var(--warn-line);   color: var(--warn); }
.chip.danger { background: var(--danger-soft); border-color: var(--danger-line); color: var(--danger); }
.chip.info   { background: var(--info-soft);   border-color: var(--info-line);   color: var(--info); }
.chip.plain  { background: transparent; }

button.chip { cursor: pointer; transition: all var(--dur); }
button.chip:hover { border-color: var(--line-strong); color: var(--ink); }
button.chip[aria-pressed='true'] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-deep); font-weight: 500; }

/* -------------------------------------------------------------- input --- */
.field { display: block; position: relative; }
.field svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); pointer-events: none; }
.input {
  width: 100%; padding: 8px 12px 8px 32px;
  border: 1px solid var(--line-strong); border-radius: var(--r-1);
  background: var(--panel); color: var(--ink);
  font-size: var(--fs-sm);
  transition: border-color var(--dur), box-shadow var(--dur);
}
.input::placeholder { color: var(--ink-faint); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.plain { padding-left: 12px; }
label.lb { display: block; font-size: 12px; font-weight: 500; color: var(--ink-muted); margin-bottom: 5px; }

/* --------------------------------------------------------------- tabs --- */
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-1); }
.tabs button {
  border: 0; background: transparent; color: var(--ink-muted);
  padding: 5px 11px; border-radius: 4px; font-size: var(--fs-xs); font-weight: 500; cursor: pointer;
  transition: all var(--dur);
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected='true'] { background: var(--panel); color: var(--ink); box-shadow: var(--sh-1); }

/* -------------------------------------------------------------- table --- */
table.tb { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
table.tb th {
  text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink-faint);
  letter-spacing: .03em; padding: 0 12px 8px; border-bottom: 1px solid var(--line);
}
table.tb td { padding: 9px 12px; border-bottom: 1px solid var(--line-hair); vertical-align: top; color: var(--ink-body); overflow-wrap: anywhere; }
table.tb tr:last-child td { border-bottom: 0; }
table.tb tbody tr { transition: background var(--dur); }
table.tb tbody tr:hover { background: var(--panel-2); }

/* -------------------------------------------------------------- lists --- */
.rows { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 11px 14px; border: 0; border-bottom: 1px solid var(--line-hair);
  background: transparent; text-align: left; cursor: pointer;
  transition: background var(--dur);
}
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--panel-2); }
.row[aria-selected='true'] { background: var(--accent-soft); }
.row .tx { min-width: 0; flex: 1; }
.row .t1 { font-size: var(--fs-sm); font-weight: 500; color: var(--ink); display: flex; align-items: center; gap: 6px; }
.row .t2 { font-size: var(--fs-xs); color: var(--ink-muted); margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }

/* -------------------------------------------------------------- check --- */
/* .chk = 带文字的勾选行；.cbx = 独立勾选框（列表行里单用）。
   两者共用一套外观，所以 .cbx 必须是 .chk 的兄弟写法而不是子类。 */
.chk { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: var(--fs-sm); }
.chk input, .cbx { appearance: none; width: 16px; height: 16px; flex: none; margin: 0;
  border: 1.5px solid var(--line-strong); border-radius: 4px; background: var(--panel);
  display: grid; place-content: center; cursor: pointer; transition: all var(--dur); }
.chk input::after, .cbx::after { content: ''; width: 8px; height: 8px; transform: scale(0); transition: transform var(--dur);
  background: var(--on-accent); clip-path: polygon(14% 44%, 0 65%, 40% 100%, 100% 16%, 82% 0%, 38% 68%); }
.chk input:checked, .cbx:checked { background: var(--accent); border-color: var(--accent); }
.chk input:checked::after, .cbx:checked::after { transform: scale(1); }
.chk input:checked + span { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.row:has(.cbx:checked) { background: var(--accent-soft); }

/* ------------------------------------------------------------- kanban --- */
.kb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.kb-col { background: var(--panel-2); border: 1px solid var(--line-hair); border-radius: var(--r-2); padding: 10px; min-height: 180px; }
.kb-col > h4 { font-size: 12px; color: var(--ink-muted); font-weight: 600; letter-spacing: .03em; margin-bottom: 9px; display: flex; align-items: center; gap: 6px; }
.kb-col > h4 u { margin-left: auto; text-decoration: none; color: var(--ink-faint); font-weight: 400; }
.task {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-1);
  padding: 10px 11px; margin-bottom: 7px; box-shadow: var(--sh-1);
}
.task p { margin: 0; font-size: var(--fs-sm); line-height: 1.55; color: var(--ink); }
.task .ops { display: flex; gap: 4px; margin-top: 8px; }
.task.done p { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.empty-hint { border: 1px dashed var(--line-strong); border-radius: var(--r-1); padding: 14px; text-align: center; font-size: var(--fs-xs); color: var(--ink-faint); }

/* ----------------------------------------------------------- timeline --- */
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: ''; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 2px; background: var(--accent-line); }
.tl li { position: relative; padding: 0 0 16px 26px; }
.tl li:last-child { padding-bottom: 0; }
.tl li::before {
  content: ''; position: absolute; left: 1px; top: 5px; width: 14px; height: 14px;
  border-radius: 50%; background: var(--panel); border: 2px solid var(--accent);
}
.tl li[data-on='1']::before { background: var(--accent); }
.tl li .h { display: flex; align-items: center; gap: 7px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink); }
.tl li .ck { margin-top: 6px; display: flex; flex-direction: column; gap: 5px; }
.tl li .art { margin-top: 6px; font-size: 11.5px; color: var(--ink-faint); }

/* ------------------------------------------------------------- drawer --- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; justify-content: flex-end; animation: fade var(--dur); }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.drawer {
  width: min(620px, 100%); background: var(--panel); height: 100%;
  border-left: 1px solid var(--line); box-shadow: var(--sh-3);
  display: flex; flex-direction: column; animation: slide var(--dur) cubic-bezier(.2,.7,.3,1);
}
@keyframes slide { from { transform: translateX(18px); opacity: .4 } to { transform: none; opacity: 1 } }
.drawer header { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.drawer header h3 { font-size: 18px; }
.drawer header p { margin: 4px 0 0; font-size: var(--fs-xs); color: var(--ink-muted); }
.drawer .body { padding: 18px 20px; overflow-y: auto; flex: 1; }
.drawer footer { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--panel-2); }

/* ----------------------------------------------------------- markdown --- */
.md { font-size: var(--fs-sm); line-height: 1.78; color: var(--ink-body); max-width: 66ch; }
.md h1 { font-size: 16px; margin: 0 0 12px; }
.md ol, .md ul { margin: 0 0 12px; padding-left: 20px; }
.md li { margin-bottom: 7px; }
.md strong { color: var(--ink); font-weight: 600; }
.md code { background: var(--panel-sunk); border: 1px solid var(--line-hair); border-radius: 4px; padding: .5px 5px; font-family: var(--mono); font-size: 12.5px; }

/* -------------------------------------------------------------- toast --- */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 14px);
  background: var(--ink); color: var(--canvas); padding: 9px 16px; border-radius: 999px;
  font-size: var(--fs-sm); z-index: 60; opacity: 0; pointer-events: none;
  transition: all var(--dur); box-shadow: var(--sh-2);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------------------------------------------------------- code block --- */
pre.code {
  margin: 0; padding: 12px 14px; border-radius: var(--r-1);
  background: var(--panel-sunk); border: 1px solid var(--line-hair);
  font-family: var(--mono); font-size: 12.5px; line-height: 1.7;
  color: var(--ink-body); overflow-x: auto; white-space: pre;
}
pre.code .cm { color: var(--accent); }
/* 窄栏里的预览：宁可折行也不横向裁切 —— 裁掉的半个字比多一行更难读 */
pre.code.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }

/* ------------------------------------------------------ design system --- */
.sw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; }
.sw { border: 1px solid var(--line); border-radius: var(--r-1); overflow: hidden; background: var(--panel); }
.sw i { display: block; height: 46px; }
.sw .meta { padding: 8px 10px; }
.sw .meta b { display: block; font-size: 12.5px; color: var(--ink); font-weight: 500; }
.sw .meta code { font-size: 11px; color: var(--ink-muted); font-family: var(--mono); }
.sw .meta em { display: block; font-style: normal; font-size: 11px; margin-top: 3px; font-variant-numeric: tabular-nums; }

.ts-row { display: grid; grid-template-columns: 128px 1fr; gap: 14px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line-hair); }
.ts-row:last-child { border-bottom: 0; }

.kv { display: grid; grid-template-columns: 96px 1fr; gap: 0 14px; margin: 0; }
.kv dt { font-size: 12.5px; color: var(--ink-muted); padding: 7px 0; border-bottom: 1px solid var(--line-hair); }
.kv dd { margin: 0; font-size: var(--fs-sm); color: var(--ink); padding: 7px 0; border-bottom: 1px solid var(--line-hair); }

.chk-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }

.chk-list svg { flex: none; margin-top: 4px; color: var(--ok); }

.note { display: flex; gap: 9px; padding: 11px 13px; border-radius: var(--r-1);
  background: var(--info-soft); border: 1px solid var(--info-line); color: var(--ink-body); font-size: var(--fs-xs); line-height: 1.65; }
.note svg { flex: none; color: var(--info); margin-top: 2px; }
.note.warn { background: var(--warn-soft); border-color: var(--warn-line); }
.note.warn svg { color: var(--warn); }

.tagbar { display: flex; flex-wrap: wrap; gap: 6px; }

.hr { height: 1px; background: var(--line-hair); border: 0; margin: 18px 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row-w { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }

/* 极简 Markdown → HTML（够用即可：标题 / 有序无序 / 加粗 / 行内码） */
function md(src) {
  const inline = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
  const out = [];
  let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of src.split('\n')) {
    const line = raw.trimEnd();
    if (!line.trim()) { close(); continue; }
    if (line.startsWith('# ')) { close(); out.push(`<h1>${inline(line.slice(2))}</h1>`); continue; }
    if (/^\d+\.\s/.test(line)) {
      if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; }
      out.push(`<li>${inline(line.replace(/^\d+\.\s/, ''))}</li>`); continue;
    }
    if (/^-\s/.test(line)) {
      if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; }
      out.push(`<li>${inline(line.slice(2))}</li>`); continue;
    }
    close();
    out.push(`<p>${inline(line)}</p>`);
  }
  close();
  return out.join('');
}

  { g: '强调', list: [['accent', '赭石', '链接 / 图标文字'], ['accent-deep', '深赭', '悬停 / 深底文字'], ['accent-soft', '浅赭', '选中容器'], ['on-accent', '反色文字', '按钮上的文字', 'accent']] },

];

function hex2rgb(h) {
  h = h.trim().replace('#', '');
  if (h.length === 3) h = h.split('').map((c) => c + c).join('');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function relLum(hex) {
  const [r, g, b] = hex2rgb(hex).map((v) => {
    const s = v / 255;
    return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function contrast(a, b) {
  const l1 = relLum(a), l2 = relLum(b);
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
}
function grade(c) {
  if (c >= 7) return { t: 'AAA', cls: 'ok' };
  if (c >= 4.5) return { t: 'AA', cls: 'ok' };
  if (c >= 3) return { t: '仅大字 / 图形', cls: 'warn' };
  return { t: '装饰专用', cls: 'danger' };
}

function setTheme(t) {
  S.theme = t;
  document.body.dataset.theme = t;
  document.documentElement.dataset.theme = t;
  render();
  toast(t === 'paper' ? '已切到暖纸（浅色）' : '已切到暖夜（深色）');
}

document.addEventListener('click', (e) => {
  const g = (sel) => e.target.closest(sel);

  const nav = g('[data-v]');            if (nav) { S.view = nav.dataset.v; closeDrawer(); render(); window.scrollTo({ top: 0 }); return; }
  const go = g('[data-go]');            if (go) { S.view = go.dataset.go; render(); return; }

  if (g('#themeBtn') || g('#themeBtn2')) { setTheme(S.theme === 'paper' ? 'night' : 'paper'); return; }

  // 提示词库
  const lt = g('[data-libtag]');       if (lt) { S.libTag = lt.dataset.libtag; render(); return; }
  const pr = g('[data-prompt]');        if (pr) { openPrompt(pr.dataset.prompt); return; }

  // 术语库
  const tt = g('[data-termtag]');       if (tt) { S.termTag = tt.dataset.termtag; render(); return; }

  // 流程
  const fw = g('[data-flow]');          if (fw) { S.flowIdx = +fw.dataset.flow; render(); return; }

  // 项目
  const mv = g('[data-mv]');
  if (mv && !mv.disabled) {
    const [id, dir] = mv.dataset.mv.split('|');
    const t = S.tasks.find((x) => x.id === +id);
    t.s = Math.max(0, Math.min(2, t.s + (dir === 'l' ? -1 : 1)));
    render();
    toast(`「${t.t.slice(0, 14)}…」→ ${COLS[t.s]}`);
    return;
  }

  // 标准包
  const pt = g('[data-packtab]');       if (pt) { S.packTab = pt.dataset.packtab; render(); return; }

  // 抽屉关闭
  if (g('[data-close]') || (g('[data-scrim]') && e.target.matches('[data-scrim]'))) { closeDrawer(); return; }

  // 其余动作：统一给反馈（原型不接后端）
  const act = g('[data-act]');
  if (act) {
    const a = act.dataset.act;
    const msg = {
      newprompt: '新建提示词：草稿入库（演示不落库）',

      dry: '干跑：写入 9 个文件 · 冲突 1 个 · 备份 1 个 · 零写入',
      sync: '同步完成：8 个 IN_SYNC，1 个冲突待决',
      'diff-file': 'diff 退出码 2 —— CLAUDE.md 报 DRIFT',
      dl: '已下载 bundle（演示）', wizard: '组包向导：5 步（演示）',
      v1: '已切到 v1', v2: '已切到 v2', v3: '已切到 v3（当前）',
      diff: 'v2 → v3：新增第 5 条「不得为完成任务放宽约束」',

document.addEventListener('input', (e) => {

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.term) {
    S.termSel.has(t.dataset.term) ? S.termSel.delete(t.dataset.term) : S.termSel.add(t.dataset.term);
    render();

  if (t.dataset.ck) {
    const [k, j] = t.dataset.ck.split('|');
    (S.flowChecks[k] = S.flowChecks[k] || {})[j] = t.checked;
    render();

  if (t.dataset.plat) {
    S.packSel.has(t.dataset.plat) ? S.packSel.delete(t.dataset.plat) : S.packSel.add(t.dataset.plat);
    render();
  }
  if (t.classList.contains('chkbox')) {
    toast(t.checked ? '已勾选：勾满才算过阶段' : '已取消勾选');

});

/* 键盘：看板左右移动（与按钮同效） */
document.addEventListener('keydown', (e) => {
  if (S.view !== 'proj' || e.metaKey || e.ctrlKey) return;

  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    const b = cur.querySelector(`[data-mv$="${e.key === 'ArrowLeft' ? '|l' : '|r'}"]`);
    if (b && !b.disabled) b.click();
  }
});

render();
</script>
</body>
</html>
