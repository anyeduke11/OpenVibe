name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {} # CI 预演通道（pnpm ci:preview）——push 前对任意 HEAD 触发同矩阵

jobs:
  verify:
    # 三平台硬要求（D5：macOS / Linux / Windows 矩阵自 T1 生效）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 读取根 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 格式闸（2026-10-26 接入）：prettier 合规曾经只靠「有人记得跑 pnpm format」——
      # 那道承诺在 2026-10-26 复算时已漂成 248 个文件不合规 ⇒ 把它变成闸。
      #
      # ⚠️ **为什么进三平台矩阵而不是单开一个作业**：格式判定与平台无关
      #   （.gitattributes 已锁 `eol=lf`，行尾不随平台漂）⇒ 单开作业只会多一次
      #   依赖安装；放进既有矩阵则与 lint/typecheck 同级、同一次 checkout 出结果。
      # ⚠️ **豁免面在 .prettierignore**：内容/种子 JSON、golden 快照与冻结面辅助件、
      #   V1 归档原型 —— 这些是逐字节契约或历史存档，排版即破坏。
      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # 2026-11-02：把**跑测试时的机器状态**落成 artifact（待办 1 的取数机制）。
      #
      # ⚠️ **为什么需要它**：`vitest.config.ts` 的 `maxWorkers: 2` 是**本机实测的保守值**，
      #   **未在 CI 上验证过**（CI runner 的核数与内存都不同于本机）⇒
      #   要判断「CI 上是不是可以放宽」，需要 CI 上的**实测数据**：
      #   可用内存、swap 使用率、实际并发、跑了多久。
      # ⇒ `pnpm test` 的前置预检已经把这些写进 `test-results/preflight.json`
      #   ⇒ 这里只负责**上传**（顺带在 summary 里显示一行档位）。
      #
      # ⚠️ **不阻断**：这个 artifact 是**证据**，不是闸 ⇒ 上传失败也不该让 CI 红。
      - name: Collect preflight evidence (machine state during tests)
        if: always()
        continue-on-error: true
        run: |
          set +e
          echo "### 跑测试时的机器状态" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/preflight.json ]; then
            cat test-results/preflight.json
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat test-results/preflight.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "（本轮没有产出 test-results/preflight.json —— 说明走了 \`--maxWorkers\` 显式指定路径或预检未执行）" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: preflight-${{ matrix.os }}
          path: test-results/preflight.json
          if-no-files-found: ignore

      # T4 起生效（阈值 60/3/0 先行），T8a-1 切正式 100/3/20 并加 §3.4 构成配额（C-57）
      - name: Seed check
        run: pnpm seed:check

      # T8f 起生效：入口 ≤300kB / 任一 chunk ≤500kB（自带 vite build，测的就是当前提交）
      - name: Bundle check
        run: pnpm bundle:check

      # 第六道闸（FR-9.3）：只**追加**，既有五闸的作业定义一字未改。
      # 文档治理校验 —— DEV 编号、队列计数自洽、相对链接目标存在、spec 版本行形状、
      # 冻结面零 diff。当前仓库的未闭合项登记在 docs/docs-check-baseline.json，
      # 退出码只对基线外的违规为 1。
      # `--json-out`：同一趟运行把 JSON 产物也写盘（供下面差分步骤吃），
      # 文件由 Node 写 ⇒ 编码跨平台确定（Windows pwsh 的 `>` 重定向会写坏 stdout）。
      - name: Docs check
        run: pnpm docs:check --json-out test-results/docs-check.json

      # 文档 warning 差分（本轮 vs 上轮，2026-11-04 落地）：`docs:check` 的 warning 是
      # 「登记在基线里的历史存量」（error 才判红）⇒ 差分把它变成**可见信号**：
      # 本轮新增的 warning 显示在 job summary 与 PR 注解上（`--annotation`），不阻断合入。
      #
      # ⚠️ 形态照抄上面的 context summary 步：`if: always()`（docs:check 判红那轮
      #   的 JSON 也该归档）＋ `shell: bash`（矩阵含 windows，默认 pwsh 不认 set +e）＋
      #   `continue-on-error`（差分是报告不是闸，网络抖动/首轮无上轮产物都不该让 CI 红）。
      # ⚠️ 上轮产物走 GitHub API（`gh` runner 自带）：上一轮 = 同名 artifact 的最新一份，
      #   每轮自己上传 ⇒ 下轮自取；首轮没有 ⇒ 降级为只报本轮计数。
      # `--history`：本轮快照追加进 test-results/docs-diff-history.json（上轮有历史文件则
      #   先拷来做底），随 docs-check.json 一并上传 ⇒ 跨轮趋势在 summary 可见。
      # U-8 的 CI 接线半（2026-11-21 补齐）：adapter 兼容矩阵是生成物，磁盘字节与
      # COMPAT_MATRIX 重渲染必须一致（ADP-FIX-04 的脚本半）。vitest 的 golden 测试
      # 只在 Test 步跑单测形态；这里用 check 形态直接对账（不修复、不一致即红）。
      - name: Adapter matrix check
        run: pnpm adapters:matrix:check

      - name: Docs check warning diff (this vs last run)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "### 文档 warning 差分（本轮 vs 上轮）" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f test-results/docs-check.json ]; then
            echo "（本轮没有 test-results/docs-check.json —— docs:check 没跑到写盘那步）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=docs-check-${{ matrix.os }}&per_page=5" --jq '.artifacts[0].archive_download_url' 2>/dev/null || true)
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "（没有上轮归档 —— 首轮运行，差分降级为只报本轮计数）" >> "$GITHUB_STEP_SUMMARY"
            node -e "const j=require('./test-results/docs-check.json');console.log('仅本轮：warning', j.findings.filter(f=>f.level==='warning').length, '条')"
            exit 0
          fi
          curl -sL -H "Authorization: Bearer ${GITHUB_TOKEN}" "$url" -o /tmp/docs-check-prev.zip
          rm -rf /tmp/docs-check-prev
          mkdir -p /tmp/docs-check-prev
          unzip -oq /tmp/docs-check-prev.zip -d /tmp/docs-check-prev
          prev=$(find /tmp/docs-check-prev -name 'docs-check.json' -print -quit)
          if [ -z "$prev" ]; then
            echo "（上轮归档里没有 docs-check.json —— 上轮 docs:check 未产出 JSON）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 历史趋势：上轮若有历史文件则拷来做底（脚本追加本轮并写回），否则脚本从头记。
          prev_hist=$(find /tmp/docs-check-prev -name 'docs-diff-history.json' -print -quit)
          if [ -n "$prev_hist" ]; then
            cp "$prev_hist" test-results/docs-diff-history.json
          fi
          pnpm docs:diff -- --json1 "$prev" --json2 test-results/docs-check.json --annotation --history test-results/docs-diff-history.json | tee /tmp/docs-diff.txt
          rc=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/docs-diff.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload docs check report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: docs-check-${{ matrix.os }}
          path: |
            test-results/docs-check.json
            test-results/docs-diff-history.json
          if-no-files-found: ignore

      # 跨机器趋势的**做底**步（2026-11-05）：`context:check` 每轮把计数追加进
      # `test-results/context-check-history.json`，但 runner 每次都是全新机器 ⇒
      # 不下载上轮历史的话，CI 侧永远只有「本轮一轮」。
      # 本步把上一 run 的同名 artifact 里的历史文件放到目标路径，`Context check`
      # 再追加本轮 ⇒ **artifact 自身就是跨 run 累积的历史**，下载一次即可合并多轮。
      #
      # ⚠️ 形态与 Docs check 的差分步一致：`if: always()` ＋ `shell: bash` ＋
      #   `continue-on-error`（恢复是证据准备，不是闸；首轮没有 artifact 也不该红）。
      - name: Restore context history (cross-run)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p test-results
          url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=context-check-${{ matrix.os }}&per_page=5" --jq '.artifacts[0].archive_download_url' 2>/dev/null || true)
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "（没有上轮 context artifact —— 本轮从零开始记）"
            exit 0
          fi
          curl -sL -H "Authorization: Bearer ${GITHUB_TOKEN}" "$url" -o /tmp/ctx-prev.zip
          rm -rf /tmp/ctx-prev
          mkdir -p /tmp/ctx-prev
          unzip -oq /tmp/ctx-prev.zip -d /tmp/ctx-prev
          prev=$(find /tmp/ctx-prev -name 'context-check-history.json' -print -quit)
          if [ -n "$prev" ]; then
            cp "$prev" test-results/context-check-history.json
            count=$(node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("/tmp/ctx-prev/context-check-history.json","utf8"));console.log(h.runs.length)')
            echo "已恢复上轮 context 历史：${count} 轮"
          else
            echo "（上轮 artifact 里没有历史文件）"
          fi
          exit 0

      # 上下文治理闸（条文见 `docs/specs/context-governance.md` §7，脚本 `scripts/context-check.ts`）：
      # 标记/辅助清单的单一出处、core/adapters/shared 的分层纪律、兼容矩阵与
      # `ADAPTER_MAIN_PATH` 一致性（这三类可红），加一条上下游闭合的只报数面。
      # 纯静态扫描、无网络、无平台差异 ⇒ 直接进三平台矩阵，不单开作业。
      - name: Context check
        run: pnpm context:check

      # 上下文结论的**轮次归档**（2026-11-04 落地）：`context:check` 每轮把计数写
      # `test-results/context-check.json`（同名覆盖 ⇒ 单机只留最近一轮）⇒ 跨轮比对
      # `coAnchors`（共锚计数，趋势主指标）必须靠**按 run 存档**，本步把两个面补上：
      # ① job summary 显示计数（连续两次 run 的 summary 页各看一眼即出差值）；
      # ② 按 run 上传 JSON（差值要可复算，光看摘要不够，得拿得到文件）。
      #
      # ⚠️ 形态照抄上面的 preflight 证据步：`if: always()` —— **判红那一轮的结论最该存档**；
      #   `continue-on-error` —— 归档是证据不是闸，摘要/上传失败不该让 CI 红。
      # ⚠️ `shell: bash`：矩阵含 windows-latest，`run:` 默认 pwsh 不认 `set +e` ——
      #   显式用 bash（runner 自带 Git Bash），三平台的摘要面才都写得出来。
      - name: Context check summary (trend counts)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "### 上下文治理结论（趋势主指标 = coAnchors 计数）" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/context-check.json ]; then
            cat test-results/context-check.json
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat test-results/context-check.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "（本轮没有产出 test-results/context-check.json —— context:check 没跑到写盘那步）" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Upload context check report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: context-check-${{ matrix.os }}
          path: |
            test-results/context-check.json
            test-results/context-check-history.json
          if-no-files-found: ignore

      # §-引用判定（`文件.md §16.10` 断没断）**已并入上面那道 `docs:check`**（判据 FR-12）——
      # 2026-10-24 起不再单开一步：两处跑同一套判定，单开的那步只是把同一批断链数两遍。
      #
      # ⚠️ **只判「限定型」引用**（带文件名的）：裸 `§N` 的指向不可判定
      #   （`§0.3`/`§0.4` 是跨文档的书写约定，`§10.4` 指 PRD 而非本文件），
      #   把裸引用当「同文件」判会造出 600 条假红 —— 假红比不红更坏。
      # ⚠️ **红只有一个口径**：被引编号的**顶层节在目标文件里不存在**（可证伪的死链）。
      #   已知存量登记在 docs/docs-check-baseline.json（与 docs:check 共用同一份）；
      #   登记项若某轮不再出现，基线的反向检查会报「该清理了」。
      # ⚠️ **裸引用仍需人工落笔** ⇒ 本地入口保留：`pnpm docs:refs` 出对账表与改写清单，
      #   `pnpm docs:refs --emit-alias-candidates` 出别名表候选登记表。
      #   别名表（`docs/section-ref-aliases.json` / `docs/doc-aliases.json`）是**建议层**，
      #   不参与判红（FR-12.9 只判「别名指向的**目标文件已不存在**」）。

      # 对账表新鲜度：对账表是**点时快照** ⇒ 会过期 ⇒ 过期了没人发现 ⇒
      # 有人拿过期表做「拆 docs/dev-plan.md」的决策（那正是它存在的理由）。
      # ⚠️ **只校验「拆分影响面」**（决策相关的那一节），不比对全文 ——
      #   全文比对会对任何文档改动都报「过期」⇒ 天天红 ⇒ 等于没有这个检查。
      # ⚠️ 断链清单**不重复校验**：它已被上面 `docs:check` 的 FR-12.1 实时守住。
      - name: Section ref report freshness
        run: pnpm docs:refs --verify-report docs/devlog-evidence/DEV-0110/section-ref-audit.md

      # 导出件防腐（**这一半能进 CI**）：导出件的 sha256 清单入仓（docs/agent-memory/manifest.json），
      # ⇒ 导出件被手改（哪怕一个字）都会让清单对不上 ⇒ 红。
      # ⚠️ 「源改了没重导」那一半**进不了 CI**（源在 agent 的本机数据目录里），
      #   由本机的 `pnpm memory:check` ＋ `scripts/hooks/pre-commit` 钩子负责。
      - name: Agent memory export manifest
        run: pnpm memory:verify

      # 队列 ⑧（owner 2026-09-27 裁「只接可机判腿 + SKIP 数入断言」）：三条冒烟进常驻闸。
      # 只跑无头形态——SM-1/SM-2 的系统剪贴板腿在无头结构上不可判，驱动器把它们记成 SKIP
      # 而不是 PASS；EXPECT_SKIP=2 让「skip 条数」本身成为断言，多一条 skip 即红，
      # 于是这份绿说的是「非剪贴板腿全过」，不是「什么都没跑」。
      # Chrome 由驱动器自己定位（CHROME_BIN 未设 ⇒ 平台常见路径 → PATH），失败退出码 2，
      # 与冒烟本身失败的 1 分得开。有头腿（真剪贴板逐字节）仍按发布节奏人工跑，留档
      # docs/devlog-evidence/DEV-0025/three-smokes-headed.txt。
      # 2026-11-14：ubuntu-24.04 镜像不再预装 google-chrome-stable（run 43554951421 实证
      # 驱动器三级候选路径全落空 ⇒ spawn('') 静默失败 ⇒ target 20s 超时「Chrome 未就绪」）。
      # 只在 Linux 腿装；macOS 有系统 Chrome，Windows 镜像自带。
      - name: Ensure Chrome (linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v google-chrome-stable >/dev/null 2>&1; then
            wget -qO- https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq google-chrome-stable
          fi

      - name: Three smokes (headless, clipboard legs expected to SKIP)
        env:
          HEADLESS: '1'
          SHOTS: '0'
          EXPECT_SKIP: '2'
        run: node docs/devlog-evidence/DEV-0025/three-smokes.mjs

  # 「可复算」从**流程**变成**闸**（2026-10-20 落）。
  #
  # spec §3.2 的硬约束是「采集脚本须能一条命令复跑并输出差异」。
  # 脚本 P1.9 已有，但**没人记得跑** ⇒ 那句话当时只是一句承诺，不是闸。
  # 本作业把 `pnpm m9:collect -- --check` 接进 CI：清单与源站逐条对账。
  #
  # ⚠️ **退出码分层是这道闸能长期开着的前提**：
  #   0 一致（绿） · 1 内容漂移（红，我们该修） · 2 不可判定（黄，第三方站点不可达，不阻断）
  #   若把「网络挂了」也算红，CI 会因站点抖动偶发红；人一旦给这道闸加 `continue-on-error`，
  #   **闸就等于没有闸**。⇒ 三层码让「环境不行」与「我们该修」分开。
  #
  # ⚠️ **不进三平台矩阵**：这是网络作业，只跑一次 ubuntu 即可，不必把三倍的机时花在网络上。
  m9-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: M9 采集对账（runoob Python3 ＋ Go 全量）
        id: collect
        continue-on-error: true
        run: |
          set +e
          pnpm m9:collect -- --check
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: 判定（0 绿 / 1 红 / 2 黄）
        env:
          RC: ${{ steps.collect.outputs.rc }}
        run: |
          if [ "$RC" = "0" ]; then
            echo "✓ 采集对账通过：已入库清单与源站逐条一致"
          elif [ "$RC" = "2" ]; then
            echo "::warning::采集对账本次**不可判定**（网络或源站不可达）—— 不阻断，但这条闸本轮没有真正跑成，请人工复跑一次"
          else
            echo "::error::采集对账失败（退出码 $RC）—— 清单与源站不一致，或解析器失灵。先跑 \`pnpm m9:collect\` 看差异，确认是源站真变了再用 \`pnpm m9:collect -- --write\` 写回"
            exit 1
          fi

      # 另三源（xinliangnote 43 篇 / walter201230 101 篇 / awesome-* 4047 条）——
      # 走 **GitHub API**，一次最多 8 个请求 ⇒ 匿名也能跑；带上 token 只是更不容易撞限流。
      #
      # ⚠️ **退出码同样分三层**，但**漂移分档**：
      #   awesome-go 是**活跃仓**（漂移是上游在正常工作）⇒ 它的漂移只报不阻断；
      #   另三个源（两个教程型 ＋ 停更 4 年的 awesome-python-cn）漂移即红。
      #   分档的事实依据写在 `scripts/collect-m9-github-sources.ts` 的 `gate` 字段 doc 里。
      - name: M9 另三源对账（GitHub API）
        id: collect-github
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          pnpm m9:collect:github -- --check
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: 判定（另三源 · 0 绿 / 1 红 / 2 黄）
        env:
          RC: ${{ steps.collect-github.outputs.rc }}
        run: |
          if [ "$RC" = "0" ]; then
            echo "✓ 另三源对账通过"
          elif [ "$RC" = "2" ]; then
            echo "::warning::另三源对账本次**不可判定**（GitHub API 不可达）—— 不阻断，但这条闸本轮没有真正跑成"
          else
            echo "::error::另三源对账失败（退出码 $RC）—— 清单与源站不一致，或解析器失灵。先跑 \`pnpm m9:collect:github\` 看差异，确认后用 \`pnpm m9:collect:github -- --write\` 写回"
            exit 1
          fi

  # 「内容未变」这道闸 —— 采集侧的验链是 **HEAD**，只验「可达」，
  # 一篇教程被改写了（标题没变、链接没变、还是 200）我们察觉不到。
  # 本作业取每篇教程页的正文区 ⇒ 归一化 ⇒ SHA-256，与已入库指纹对账。
  #
  # ⚠️ **指纹漂移即红**（和 `seed:check` 同一形态）：仓里那一份是「某个日期的快照」，
  #   上游改了 ⇒ 快照过期 ⇒ 该刷新。刷新是一条命令：
  #   `pnpm m9:fingerprint -- --write`（写前有备份 ＋ 差异快照）。
  # ⚠️ **只存摘要不存正文**（spec §3.2）—— 灰区处置见 scripts/m9-content-fingerprint.ts 文件头，
  #   补偿控制（字段闭集 ＋ hex 校验 ＋ 仍在扫描面内）由 packages/core/src/db/m9-external-content-scan.ts 钉住。
  m9-fingerprint:
    # ⚠️ 仅手动触发（workflow_dispatch，ci:preview 同款通道）：runoob 对数据中心 IP
    #   返回稳定不同的正文变体（run 406472/435498 两轮同批 6 篇实证），push 触发时
    #   该闸在 CI 环境永远无法判定 ⇒ 跳过（本地 `pnpm m9:fingerprint` 判据照常在）。
    #   （2026-11-21 收口时回插——并行会话的工作树版本丢了这个守卫，push 触发即红。）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: runoob 两门内容指纹对账
        id: fingerprint
        continue-on-error: true
        run: |
          set +e
          pnpm m9:fingerprint -- --check
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: 判定（0 绿 / 1 红 / 2 黄）
        env:
          RC: ${{ steps.fingerprint.outputs.rc }}
        run: |
          if [ "$RC" = "0" ]; then
            echo "✓ 内容指纹一致：全部教程内容与已入库快照逐条相同"
          elif [ "$RC" = "2" ]; then
            echo "::warning::内容指纹本次**不可判定**（网络不可达）—— 不阻断，但这条闸本轮没有真正跑成"
          else
            echo "::error::内容指纹过期或取不到正文区（退出码 $RC）—— 跑 \`pnpm m9:fingerprint -- --write\` 刷新快照后提交"
            exit 1
          fi

  # R6 · 交付验证：pack + 隔离安装 + dist 冒烟（v0.2.4 F9 / PRD 第 6 章 R6）。
  #
  # ⚠️ 为什么单开作业而不塞进 verify 矩阵：verify 跑的是**源码形态**（tsx 入口），
  #   本作业跑的是**发布形态**（npm pack 出的 tarball 装进干净目录）。源码绿而包坏是
  #   真实情形——files 漏项、bin 指向源码、原生依赖没进清单、打包后相对路径失效——
  #   只有真装真跑才暴露。
  # ⚠️ 平台范围跟随 D-e：Linux + macOS 必须，Windows 未纳入（R8 同名判定用例未补）。
  # ⚠️ 失败即红、不设 allow_failure（F9 验收判据原文）。
  pkg-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 读取根 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build package (pkg:cli)
        run: pnpm pkg:cli

      - name: Pack tarball
        id: pack
        working-directory: apps/cli/pkg
        run: |
          name=$(npm pack --silent)
          echo "打包产物：$name"
          ls -lh "$name"
          echo "tarball=$name" >> "$GITHUB_OUTPUT"

      # 隔离安装：干净目录、只装 tarball。npm 12 起默认拦安装脚本 ⇒ 必须显式放行
      # better-sqlite3（原生绑定只能由 prebuild-install 下载或 node-gyp 编译产出；
      # 不放行就是「装得上但 serve 起不来」）。
      - name: Isolated install
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          npm init -y >/dev/null 2>&1
          printf 'allow-scripts=better-sqlite3\n' > .npmrc
          npm install "${GITHUB_WORKSPACE}/apps/cli/pkg/${TARBALL}" --no-audit --no-fund
          echo "隔离安装目录：${SMOKE}"
          echo "SMOKE_DIR=${SMOKE}" >> "$GITHUB_ENV"

      - name: 'Smoke: --version / --help'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          BIN="${SMOKE_DIR}/node_modules/.bin/openvibe"
          "$BIN" --help | grep -q 'serve' || { echo "::error::--help 未列出 serve"; exit 1; }
          version=$("$BIN" --version)
          expected="${TARBALL#openvibe-cli-}"
          expected="${expected%.tgz}"
          echo "装到的版本：${version}（tarball 期望 ${expected}）"
          [ "$version" = "$expected" ] || { echo "::error::版本号与 tarball 不符"; exit 1; }

      # serve 健康检查 + sync --dry-run + diff + verify + scan + clean：复用既有复验矩阵
      # 工具（scripts/verify-matrix.ts）的 --bin 模式——它起临时 serve + 临时项目，
      # 跑可自动化的本地子集，任一 fail 即退出码 1（manual 项如实标注未验证）。
      - name: 'Smoke: serve health + sync --dry-run (verify-matrix --bin)'
        run: pnpm verify:matrix --run --bin "${SMOKE_DIR}/node_modules/openvibe-cli/dist/cli.js"
