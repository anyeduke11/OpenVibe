name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # 三平台硬要求（D5：macOS / Linux / Windows 矩阵自 T1 生效）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 读取根 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # T4 起生效，阈值 terms≥60 / templates=3 / prompts=0（T8 切 100/3/20）
      - name: Seed check
        run: pnpm seed:check
