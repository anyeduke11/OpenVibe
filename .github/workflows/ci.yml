name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {} # CI 预演通道（pnpm ci:preview）——push 前对任意 HEAD 触发同矩阵

jobs:
  verify:
    # 三平台硬要求（D5：macOS / Linux / Windows 矩阵自 T1 生效）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 读取根 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 格式闸（2026-10-26 接入）：prettier 合规曾经只靠「有人记得跑 pnpm format」——
      # 那道承诺在 2026-10-26 复算时已漂成 248 个文件不合规 ⇒ 把它变成闸。
      #
      # ⚠️ **为什么进三平台矩阵而不是单开一个作业**：格式判定与平台无关
      #   （.gitattributes 已锁 `eol=lf`，行尾不随平台漂）⇒ 单开作业只会多一次
      #   依赖安装；放进既有矩阵则与 lint/typecheck 同级、同一次 checkout 出结果。
      # ⚠️ **豁免面在 .prettierignore**：内容/种子 JSON、golden 快照与冻结面辅助件、
      #   V1 归档原型 —— 这些是逐字节契约或历史存档，排版即破坏。
      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # T4 起生效（阈值 60/3/0 先行），T8a-1 切正式 100/3/20 并加 §3.4 构成配额（C-57）
      - name: Seed check
        run: pnpm seed:check

      # T8f 起生效：入口 ≤300kB / 任一 chunk ≤500kB（自带 vite build，测的就是当前提交）
      - name: Bundle check
        run: pnpm bundle:check

      # 第六道闸（FR-9.3）：只**追加**，既有五闸的作业定义一字未改。
      # 文档治理校验 —— DEV 编号、队列计数自洽、相对链接目标存在、spec 版本行形状、
      # 冻结面零 diff。当前仓库的未闭合项登记在 docs/docs-check-baseline.json，
      # 退出码只对基线外的违规为 1。
      - name: Docs check
        run: pnpm docs:check

      # §-引用判定（`文件.md §16.10` 断没断）**已并入上面那道 `docs:check`**（判据 FR-12）——
      # 2026-10-24 起不再单开一步：两处跑同一套判定，单开的那步只是把同一批断链数两遍。
      #
      # ⚠️ **只判「限定型」引用**（带文件名的）：裸 `§N` 的指向不可判定
      #   （`§0.3`/`§0.4` 是跨文档的书写约定，`§10.4` 指 PRD 而非本文件），
      #   把裸引用当「同文件」判会造出 600 条假红 —— 假红比不红更坏。
      # ⚠️ **红只有一个口径**：被引编号的**顶层节在目标文件里不存在**（可证伪的死链）。
      #   已知存量登记在 docs/docs-check-baseline.json（与 docs:check 共用同一份）；
      #   登记项若某轮不再出现，基线的反向检查会报「该清理了」。
      # ⚠️ **裸引用仍需人工落笔** ⇒ 本地入口保留：`pnpm docs:refs` 出对账表与改写清单，
      #   `pnpm docs:refs --emit-alias-candidates` 出别名表候选登记表。
      #   别名表（`docs/section-ref-aliases.json` / `docs/doc-aliases.json`）是**建议层**，
      #   不参与判红（FR-12.9 只判「别名指向的**目标文件已不存在**」）。

      # 对账表新鲜度：对账表是**点时快照** ⇒ 会过期 ⇒ 过期了没人发现 ⇒
      # 有人拿过期表做「拆 docs/dev-plan.md」的决策（那正是它存在的理由）。
      # ⚠️ **只校验「拆分影响面」**（决策相关的那一节），不比对全文 ——
      #   全文比对会对任何文档改动都报「过期」⇒ 天天红 ⇒ 等于没有这个检查。
      # ⚠️ 断链清单**不重复校验**：它已被上面 `docs:check` 的 FR-12.1 实时守住。
      - name: Section ref report freshness
        run: pnpm docs:refs --verify-report docs/devlog-evidence/DEV-0110/section-ref-audit.md

      # 导出件防腐（**这一半能进 CI**）：导出件的 sha256 清单入仓（docs/agent-memory/manifest.json），
      # ⇒ 导出件被手改（哪怕一个字）都会让清单对不上 ⇒ 红。
      # ⚠️ 「源改了没重导」那一半**进不了 CI**（源在 agent 的本机数据目录里），
      #   由本机的 `pnpm memory:check` ＋ `scripts/hooks/pre-commit` 钩子负责。
      - name: Agent memory export manifest
        run: pnpm memory:verify

      # 队列 ⑧（owner 2026-09-27 裁「只接可机判腿 + SKIP 数入断言」）：三条冒烟进常驻闸。
      # 只跑无头形态——SM-1/SM-2 的系统剪贴板腿在无头结构上不可判，驱动器把它们记成 SKIP
      # 而不是 PASS；EXPECT_SKIP=2 让「skip 条数」本身成为断言，多一条 skip 即红，
      # 于是这份绿说的是「非剪贴板腿全过」，不是「什么都没跑」。
      # Chrome 由驱动器自己定位（CHROME_BIN 未设 ⇒ 平台常见路径 → PATH），失败退出码 2，
      # 与冒烟本身失败的 1 分得开。有头腿（真剪贴板逐字节）仍按发布节奏人工跑，留档
      # docs/devlog-evidence/DEV-0025/three-smokes-headed.txt。
      - name: Three smokes (headless, clipboard legs expected to SKIP)
        env:
          HEADLESS: '1'
          SHOTS: '0'
          EXPECT_SKIP: '2'
        run: node docs/devlog-evidence/DEV-0025/three-smokes.mjs

  # 「可复算」从**流程**变成**闸**（2026-10-20 落）。
  #
  # spec §3.2 的硬约束是「采集脚本须能一条命令复跑并输出差异」。
  # 脚本 P1.9 已有，但**没人记得跑** ⇒ 那句话当时只是一句承诺，不是闸。
  # 本作业把 `pnpm m9:collect -- --check` 接进 CI：清单与源站逐条对账。
  #
  # ⚠️ **退出码分层是这道闸能长期开着的前提**：
  #   0 一致（绿） · 1 内容漂移（红，我们该修） · 2 不可判定（黄，第三方站点不可达，不阻断）
  #   若把「网络挂了」也算红，CI 会因站点抖动偶发红；人一旦给这道闸加 `continue-on-error`，
  #   **闸就等于没有闸**。⇒ 三层码让「环境不行」与「我们该修」分开。
  #
  # ⚠️ **不进三平台矩阵**：这是网络作业，只跑一次 ubuntu 即可，不必把三倍的机时花在网络上。
  m9-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: M9 采集对账（runoob Python3 ＋ Go 全量）
        id: collect
        continue-on-error: true
        run: |
          set +e
          pnpm m9:collect -- --check
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: 判定（0 绿 / 1 红 / 2 黄）
        env:
          RC: ${{ steps.collect.outputs.rc }}
        run: |
          if [ "$RC" = "0" ]; then
            echo "✓ 采集对账通过：已入库清单与源站逐条一致"
          elif [ "$RC" = "2" ]; then
            echo "::warning::采集对账本次**不可判定**（网络或源站不可达）—— 不阻断，但这条闸本轮没有真正跑成，请人工复跑一次"
          else
            echo "::error::采集对账失败（退出码 $RC）—— 清单与源站不一致，或解析器失灵。先跑 \`pnpm m9:collect\` 看差异，确认是源站真变了再用 \`pnpm m9:collect -- --write\` 写回"
            exit 1
          fi

      # 另三源（xinliangnote 43 篇 / walter201230 101 篇 / awesome-* 4047 条）——
      # 走 **GitHub API**，一次最多 8 个请求 ⇒ 匿名也能跑；带上 token 只是更不容易撞限流。
      #
      # ⚠️ **退出码同样分三层**，但**漂移分档**：
      #   awesome-go 是**活跃仓**（漂移是上游在正常工作）⇒ 它的漂移只报不阻断；
      #   另三个源（两个教程型 ＋ 停更 4 年的 awesome-python-cn）漂移即红。
      #   分档的事实依据写在 `scripts/collect-m9-github-sources.ts` 的 `gate` 字段 doc 里。
      - name: M9 另三源对账（GitHub API）
        id: collect-github
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          pnpm m9:collect:github -- --check
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: 判定（另三源 · 0 绿 / 1 红 / 2 黄）
        env:
          RC: ${{ steps.collect-github.outputs.rc }}
        run: |
          if [ "$RC" = "0" ]; then
            echo "✓ 另三源对账通过"
          elif [ "$RC" = "2" ]; then
            echo "::warning::另三源对账本次**不可判定**（GitHub API 不可达）—— 不阻断，但这条闸本轮没有真正跑成"
          else
            echo "::error::另三源对账失败（退出码 $RC）—— 清单与源站不一致，或解析器失灵。先跑 \`pnpm m9:collect:github\` 看差异，确认后用 \`pnpm m9:collect:github -- --write\` 写回"
            exit 1
          fi

  # 「内容未变」这道闸 —— 采集侧的验链是 **HEAD**，只验「可达」，
  # 一篇教程被改写了（标题没变、链接没变、还是 200）我们察觉不到。
  # 本作业取每篇教程页的正文区 ⇒ 归一化 ⇒ SHA-256，与已入库指纹对账。
  #
  # ⚠️ **指纹漂移即红**（和 `seed:check` 同一形态）：仓里那一份是「某个日期的快照」，
  #   上游改了 ⇒ 快照过期 ⇒ 该刷新。刷新是一条命令：
  #   `pnpm m9:fingerprint -- --write`（写前有备份 ＋ 差异快照）。
  # ⚠️ **只存摘要不存正文**（spec §3.2）—— 灰区处置见 scripts/m9-content-fingerprint.ts 文件头，
  #   补偿控制（字段闭集 ＋ hex 校验 ＋ 仍在扫描面内）由 packages/core/src/db/m9-external-content-scan.ts 钉住。
  m9-fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: runoob 两门内容指纹对账
        id: fingerprint
        continue-on-error: true
        run: |
          set +e
          pnpm m9:fingerprint -- --check
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: 判定（0 绿 / 1 红 / 2 黄）
        env:
          RC: ${{ steps.fingerprint.outputs.rc }}
        run: |
          if [ "$RC" = "0" ]; then
            echo "✓ 内容指纹一致：全部教程内容与已入库快照逐条相同"
          elif [ "$RC" = "2" ]; then
            echo "::warning::内容指纹本次**不可判定**（网络不可达）—— 不阻断，但这条闸本轮没有真正跑成"
          else
            echo "::error::内容指纹过期或取不到正文区（退出码 $RC）—— 跑 \`pnpm m9:fingerprint -- --write\` 刷新快照后提交"
            exit 1
          fi
