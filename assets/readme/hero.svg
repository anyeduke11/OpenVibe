<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="ov-hero-title ov-hero-desc">
  <title id="ov-hero-title">OpenVibe 灵典 —— vibe coding 的标准化工作台</title>
  <desc id="ov-hero-desc">左侧为产品名与一句话价值，右侧为 openvibe diff 的真实产物清单：八个受管文件加一个台账，手改过的文件报 DRIFT，其余 IN_SYNC。</desc>

  <rect width="1200" height="420" rx="24" fill="#fafafa" stroke="#e4e4e4" stroke-width="1.5"/>

  <g id="title-block" transform="translate(56 52)">
    <g id="logo-mark">
      <rect width="64" height="64" rx="14" fill="#2f6f4f"/>
      <path d="M20 18h18a10 10 0 0 1 0 20h-8v8h-10z" fill="none" stroke="#fff" stroke-width="5.2"/>
      <circle cx="41" cy="45" r="4.4" fill="#fff"/>
    </g>
    <text x="84" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#727272">本地优先 · 无账号 · 无后台常驻</text>
    <text x="84" y="60" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="44" font-weight="700" fill="#181818">OpenVibe 灵典</text>

    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="21" fill="#404040">把提示词、术语、流程模板与项目经验收进一个本地库，</text>
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="21" fill="#404040">组装成标准包，一条命令注入六个 AI 助手的项目目录。</text>

    <g id="meta-chips" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <rect x="0" y="180" width="112" height="32" rx="8" fill="#e8f1ec"/>
      <text x="56" y="201" text-anchor="middle" fill="#2f6f4f">Node ≥ 22</text>
      <rect x="122" y="180" width="124" height="32" rx="8" fill="#e8f1ec"/>
      <text x="184" y="201" text-anchor="middle" fill="#2f6f4f">Apache-2.0</text>
      <rect x="256" y="180" width="242" height="32" rx="8" fill="#e8f1ec"/>
      <text x="377" y="201" text-anchor="middle" fill="#2f6f4f">单文件 CLI · 本地 SQLite</text>
    </g>

    <g id="state-legend" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <text x="0" y="246" fill="#727272">注入规划五态：</text>
      <circle cx="132" cy="240" r="5.5" fill="#2f6f4f"/>
      <text x="146" y="246" fill="#404040">NEW</text>
      <circle cx="210" cy="240" r="5.5" fill="none" stroke="#727272" stroke-width="2"/>
      <text x="224" y="246" fill="#404040">IN_SYNC</text>
      <path d="M342 234l6.5 12h-13z" fill="#8a6a12"/>
      <text x="356" y="246" fill="#404040">UPDATE</text>
      <path d="M6 272l6.5 6.5-6.5 6.5-6.5-6.5z" fill="#8a6a12"/>
      <text x="20" y="278" fill="#404040">CONFLICT 冲突三选一</text>
      <path d="M240 273l11 11m0-11l-11 11" stroke="#b3372f" stroke-width="2.6"/>
      <text x="254" y="278" fill="#404040">DRIFT 指纹不一致</text>
    </g>

    <text x="0" y="316" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="18" fill="#535353">覆盖任何已有文件前，原件先备份进 .openvibe/backup/。</text>
  </g>

  <g id="diff-manifest" transform="translate(700 40)">
    <rect width="444" height="356" rx="14" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="5" fill="#d4d4d4"/>
    <circle cx="42" cy="22" r="5" fill="#d4d4d4"/>
    <circle cx="60" cy="22" r="5" fill="#d4d4d4"/>
    <text x="80" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#535353">$ openvibe diff ~/proj</text>
    <line x1="0" y1="44" x2="444" y2="44" stroke="#e4e4e4" stroke-width="1.5"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <text x="20" y="76" fill="#404040">CLAUDE.md</text>
      <text x="424" y="76" text-anchor="end" fill="#b3372f">DRIFT</text>
      <text x="20" y="105" fill="#404040">.cursor/rules/openvibe.mdc</text>
      <text x="424" y="105" text-anchor="end" fill="#727272">IN_SYNC</text>
      <text x="20" y="134" fill="#404040">AGENTS.md</text>
      <text x="424" y="134" text-anchor="end" fill="#727272">IN_SYNC</text>
      <text x="20" y="163" fill="#404040">CODEBUDDY.md</text>
      <text x="424" y="163" text-anchor="end" fill="#727272">IN_SYNC</text>
      <text x="20" y="192" fill="#404040">.trae/rules/openvibe.md</text>
      <text x="424" y="192" text-anchor="end" fill="#727272">IN_SYNC</text>
      <text x="20" y="221" fill="#404040">MINI.md</text>
      <text x="424" y="221" text-anchor="end" fill="#727272">IN_SYNC</text>
      <text x="20" y="250" fill="#404040">TERMS.md</text>
      <text x="424" y="250" text-anchor="end" fill="#727272">IN_SYNC</text>
      <text x="20" y="279" fill="#404040">CHECKLIST.md</text>
      <text x="424" y="279" text-anchor="end" fill="#727272">IN_SYNC</text>
      <text x="20" y="308" fill="#404040">.openvibe/pack.lock.json</text>
      <text x="424" y="308" text-anchor="end" fill="#727272">IN_SYNC</text>
    </g>
    <line x1="20" y1="324" x2="424" y2="324" stroke="#e4e4e4" stroke-width="1.5"/>
    <text x="20" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#727272">exit 2 = 有漂移 · 覆盖前必定备份</text>
  </g>
</svg>
